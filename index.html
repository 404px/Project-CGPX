<!DOCTYPE html>
<html lang="ko" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>승강기기능사 CBT 시험장</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Pretendard', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; user-select: none; }
        
        .text-size-sm { font-size: 0.875rem; }
        .text-size-base { font-size: 1rem; }
        .text-size-lg { font-size: 1.125rem; }
        .text-size-xl { font-size: 1.25rem; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }

        /* Slide Transition Container */
        .slide-container {
            display: flex;
            transition: transform 0.25s ease-in-out;
            will-change: transform;
        }

        .slide-item {
            flex: 0 0 100%;
            width: 100%;
        }

        .katex-display { margin: 0.4em 0 !important; }

        /* ================= PIN 인증 레이어 스타일 ================= */
        #pin-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(15, 23, 42, 0.98);
            backdrop-filter: blur(12px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999; /* 최고 상위 레이어 지정 */
            padding: 20px;
            box-sizing: border-box;
        }

        .pin-card {
            background: #1e293b;
            border: 1px solid #334155;
            padding: 36px 28px;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 360px;
            width: 100%;
            color: #f8fafc;
        }

        .pin-card h2 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: #f8fafc;
        }

        .pin-card p {
            font-size: 0.875rem;
            color: #94a3b8;
            margin-bottom: 24px;
        }

        .pin-input-container {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
            position: relative;
        }

        .real-pin-input {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
            font-size: 1px;
        }

        .pin-digit {
            width: 52px;
            height: 60px;
            border: 2px solid #334155;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: 700;
            color: #38bdf8;
            background: #0f172a;
            transition: all 0.2s ease;
        }

        .pin-digit.active {
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        }

        .pin-digit.filled {
            border-color: #0284c7;
        }

        .status-msg {
            font-size: 0.875rem;
            min-height: 20px;
            margin-top: 10px;
            font-weight: 500;
        }

        .status-msg.error { color: #f87171; }
        .status-msg.lockout { color: #fbbf24; }

        .shake {
            animation: shake 0.4s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 dark:bg-slate-900 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-200">

    <div id="pin-overlay">
        <div class="pin-card" id="pin-card">

                <div class="pin-digit" id="digit-2"></div>

            </div>

            <div id="status-msg" class="status-msg"></div>
        </div>
    </div>

    <script>
        // ================= PIN 인증 시스템 영역 =================
        const CORRECT_PIN = "8250"; // 설정할 PIN 번호
        const MAX_ATTEMPTS = 5;
        const LOCKOUT_SECONDS = 30;

        let failedAttempts = 0;
        let pinTimerInterval = null;

        const realPinInput = document.getElementById('real-pin');
        const pinOverlay = document.getElementById('pin-overlay');
        const statusMsg = document.getElementById('status-msg');
        const pinCard = document.getElementById('pin-card');
        const digitBoxes = [
            document.getElementById('digit-0'),
            document.getElementById('digit-1'),
            document.getElementById('digit-2'),
            document.getElementById('digit-3')
        ];

        function setCookie(name, value, seconds) {
            let expires = "";
            if (seconds) {
                const date = new Date();
                date.setTime(date.getTime() + (seconds * 1000));
                expires = "; expires=" + date.toUTCString();
            }
            document.cookie = name + "=" + (value || "") + expires + "; path=/; SameSite=Lax";
        }

        function getCookie(name) {
            const nameEQ = name + "=";
            const ca = document.cookie.split(';');
            for(let i = 0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) === ' ') c = c.substring(1, c.length);
                if (c.indexOf(nameEQ) === 0) return c.substring(nameEQ.length, c.length);
            }
            return null;
        }

        function deleteCookie(name) {
            document.cookie = name +'=; Path=/; Expires=Thu, 01 Jan 1970 00:00:01 GMT;';
        }

        function checkLockoutState() {
            const lockoutUntil = getCookie("pin_lockout_until");
            if (lockoutUntil) {
                const remainingMs = parseInt(lockoutUntil, 10) - Date.now();
                if (remainingMs > 0) {
                    const remainingSeconds = Math.ceil(remainingMs / 1000);
                    startLockout(remainingSeconds);
                } else {
                    deleteCookie("pin_lockout_until");
                    unlockInput();
                }
            } else {
                unlockInput();
            }
        }

        realPinInput.addEventListener('input', function(e) {
            e.stopPropagation();
            const value = this.value;
            
            digitBoxes.forEach((box, index) => {
                if (index < value.length) {
                    box.textContent = '•';
                    box.classList.add('filled');
                    box.classList.remove('active');
                } else if (index === value.length) {
                    box.textContent = '';
                    box.classList.remove('filled');
                    box.classList.add('active');
                } else {
                    box.textContent = '';
                    box.classList.remove('filled', 'active');
                }
            });

            if (value.length === 4) {
                verifyPin(value);
            }
        });

        function verifyPin(enteredPin) {
            if (enteredPin === CORRECT_PIN) {
                deleteCookie("pin_lockout_until");
                pinOverlay.style.display = 'none';
            } else {
                failedAttempts++;
                realPinInput.value = '';
                resetBoxes();

                if (failedAttempts >= MAX_ATTEMPTS) {
                    const lockoutUntil = Date.now() + (LOCKOUT_SECONDS * 1000);
                    setCookie("pin_lockout_until", lockoutUntil, LOCKOUT_SECONDS);
                    startLockout(LOCKOUT_SECONDS);
                } else {
                    triggerShake();
                    statusMsg.className = "status-msg error";
                    statusMsg.textContent = `PIN이 일치하지 않습니다. (${failedAttempts}/${MAX_ATTEMPTS})`;
                }
            }
        }

        function resetBoxes() {
            digitBoxes.forEach((box, index) => {
                box.textContent = '';
                box.classList.remove('filled', 'active');
                if (index === 0) box.classList.add('active');
            });
        }

        function triggerShake() {
            pinCard.classList.remove('shake');
            void pinCard.offsetWidth;
            pinCard.classList.add('shake');
        }

        function startLockout(seconds) {
            realPinInput.disabled = true;
            realPinInput.value = '';
            resetBoxes();
            
            digitBoxes.forEach(box => box.classList.remove('active'));

            let remaining = seconds;
            statusMsg.className = "status-msg lockout";
            statusMsg.textContent = `5회 연속 실패. ${remaining}초 후 다시 시도하세요.`;

            if (pinTimerInterval) clearInterval(pinTimerInterval);

            pinTimerInterval = setInterval(() => {
                remaining--;
                if (remaining > 0) {
                    statusMsg.textContent = `5회 연속 실패. ${remaining}초 후 다시 시도하세요.`;
                } else {
                    clearInterval(pinTimerInterval);
                    deleteCookie("pin_lockout_until");
                    unlockInput();
                }
            }, 1000);
        }

        function unlockInput() {
            failedAttempts = 0;
            realPinInput.disabled = false;
            statusMsg.textContent = '';
            statusMsg.className = "status-msg";
            resetBoxes();
            realPinInput.focus();
        }

        document.addEventListener('click', function() {
            if (pinOverlay.style.display !== 'none' && !realPinInput.disabled) {
                realPinInput.focus();
            }
        });

        // ================= CBT 시스템 영역 =================
        let examListMap = {};
        let currentQuestions = [];
        let userAnswers = {};      
        let isAnswerLocked = {};   
        let currentIndex = 0;
        let examMode = "exam";     
        let timerInterval = null;
        let timeRemaining = 3600;
        let fontSizeLevel = 1;
        const fontSizeClasses = ['text-size-sm', 'text-size-base', 'text-size-lg', 'text-size-xl'];

        let touchStartX = 0;
        let touchEndX = 0;

        window.addEventListener('DOMContentLoaded', () => {
            checkLockoutState();
            initDarkMode();
            fetchListJson();
            applyFontSize();
            setupKeyboardNav();
            setupSwipeNav();
        });

        function initDarkMode() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                document.getElementById('darkModeIcon').className = "fa-solid fa-sun text-amber-400";
            } else {
                document.documentElement.classList.remove('dark');
                document.getElementById('darkModeIcon').className = "fa-solid fa-moon";
            }
        }

        function toggleDarkMode() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            document.getElementById('darkModeIcon').className = isDark ? "fa-solid fa-sun text-amber-400" : "fa-solid fa-moon";
        }

        async function fetchListJson() {
            const select = document.getElementById('examSelect');
            try {
                const response = await fetch('./list.json');
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                examListMap = await response.json();
                
                select.innerHTML = '';
                const keys = Object.keys(examListMap);

                if (keys.length === 0) {
                    select.innerHTML = '<option value="" disabled>등록된 시험이 없습니다.</option>';
                    return;
                }

                keys.forEach((key) => {
                    const opt = document.createElement('option');
                    opt.value = key;
                    opt.textContent = examListMap[key];
                    select.appendChild(opt);
                });
            } catch (error) {
                console.error('list.json 로드 실패:', error);
                select.innerHTML = '<option value="" disabled>list.json 불러오기 실패</option>';
                showModal("오류", "list.json 파일 불러오기에 실패했습니다.\n파일 경로를 확인하세요.", [{
                    text: "확인", bg: "bg-red-600", action: closeModal
                }]);
            }
        }

        async function startExam() {
            const select = document.getElementById('examSelect');
            const selectedKey = select.value;

            if (!selectedKey) {
                showModal("알림", "시험 회차를 선택해주세요.", [{ text: "확인", bg: "bg-blue-600", action: closeModal }]);
                return;
            }

            setStartBtnLoading(true);

            try {
                const response = await fetch(`./${selectedKey}.json`);
                if (!response.ok) throw new Error(`해당 회차(${selectedKey}.json) 파일을 찾을 수 없습니다.`);
                
                currentQuestions = await response.json();
                if (!Array.isArray(currentQuestions) || currentQuestions.length === 0) {
                    throw new Error("문제 데이터 구조가 올바르지 않습니다.");
                }

                examMode = document.querySelector('input[name="examMode"]:checked').value;
                userAnswers = {};
                isAnswerLocked = {};
                currentIndex = 0;
                timeRemaining = 3600;

                document.getElementById('startScreen').classList.add('hidden');
                document.getElementById('resultScreen').classList.add('hidden');
                document.getElementById('examScreen').classList.remove('hidden');
                
                document.getElementById('headerTitle').textContent = examListMap[selectedKey] || "승강기기능사 CBT";
                document.getElementById('totalQuestionsCount').textContent = currentQuestions.length;

                if (examMode === 'exam') {
                    document.getElementById('timerContainer').classList.remove('hidden');
                    startTimer();
                } else {
                    document.getElementById('timerContainer').classList.add('hidden');
                }

                renderSlides();
                renderOMR();
                updateSlidePosition();

            } catch (error) {
                console.error("문제 로드 실패:", error);
                showModal("문제 로드 실패", error.message || "문제 파일(.json)을 불러오지 못했습니다.", [{
                    text: "확인", bg: "bg-red-600", action: closeModal
                }]);
            } finally {
                setStartBtnLoading(false);
            }
        }

        function setStartBtnLoading(isLoading) {
            const btn = document.getElementById('btnStart');
            const btnText = document.getElementById('btnStartText');
            const btnIcon = document.getElementById('btnStartIcon');

            if (isLoading) {
                btn.disabled = true;
                btnText.textContent = "문제 로딩 중...";
                btnIcon.className = "fa-solid fa-spinner fa-spin";
            } else {
                btn.disabled = false;
                btnText.textContent = "시험 시작하기";
                btnIcon.className = "fa-solid fa-arrow-right";
            }
        }

        function renderSlides() {
            const container = document.getElementById('slideContainer');
            container.innerHTML = '';

            currentQuestions.forEach((q, idx) => {
                const item = document.createElement('div');
                item.className = "slide-item px-1";

                const userSelected = userAnswers[q.id];
                const isLocked = isAnswerLocked[q.id] || false;

                let optionsHTML = '<div class="space-y-3 my-5">';
                q.options.forEach((opt, oIdx) => {
                    const optNum = oIdx + 1;
                    const isSelected = userSelected === optNum;

                    let cardStyle = "border-slate-200 dark:border-slate-700/80 bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:border-blue-400 dark:hover:border-blue-500";
                    let badgeStyle = "border-slate-300 dark:border-slate-600 text-slate-500 dark:text-slate-400";

                    if (isSelected) {
                        cardStyle = "border-blue-600 bg-blue-50/80 dark:bg-blue-900/40 text-blue-900 dark:text-blue-100 font-semibold ring-2 ring-blue-500/30";
                        badgeStyle = "border-blue-600 bg-blue-600 text-white";
                    }

                    if (isLocked && examMode === 'practice') {
                        const isRight = q.answer === optNum;
                        if (isRight) {
                            cardStyle = "border-emerald-500 bg-emerald-50 dark:bg-emerald-950/40 text-emerald-900 dark:text-emerald-200 font-bold";
                            badgeStyle = "border-emerald-600 bg-emerald-600 text-white";
                        } else if (isSelected && !isRight) {
                            cardStyle = "border-red-500 bg-red-50 dark:bg-red-950/40 text-red-900 dark:text-red-200 font-bold";
                            badgeStyle = "border-red-600 bg-red-600 text-white";
                        }
                    }

                    optionsHTML += `
                        <button onclick="selectOption(${q.id}, ${optNum})" ${isLocked ? 'disabled' : ''} class="w-full text-left flex items-center p-4 rounded-2xl border-2 transition ${cardStyle} ${isLocked ? 'cursor-default' : 'cursor-pointer'}">
                            <div class="w-7 h-7 rounded-full border-2 flex items-center justify-center text-xs font-bold mr-3.5 shrink-0 transition ${badgeStyle}">
                                ${optNum}
                            </div>
                            <span class="text-sm md:text-base leading-relaxed">${opt}</span>
                        </button>
                    `;
                });
                optionsHTML += '</div>';

                let explanationHTML = '';
                if (examMode === 'practice' && isLocked) {
                    const isCorrect = userSelected === q.answer;
                    explanationHTML = `
                        <div class="mt-5 p-4 rounded-2xl border ${isCorrect ? 'bg-emerald-50/80 border-emerald-200 dark:bg-emerald-950/30 dark:border-emerald-800/60' : 'bg-red-50/80 border-red-200 dark:bg-red-950/30 dark:border-red-800/60'}">
                            <div class="flex items-center mb-2 font-bold ${isCorrect ? 'text-emerald-700 dark:text-emerald-400' : 'text-red-700 dark:text-red-400'}">
                                <i class="fa-solid ${isCorrect ? 'fa-circle-check' : 'fa-circle-xmark'} mr-2 text-lg"></i>
                                <span>${isCorrect ? '정답입니다!' : `오답입니다. (정답: ${q.answer}번)`}</span>
                            </div>
                            <div class="text-xs sm:text-sm text-slate-700 dark:text-slate-300 leading-relaxed space-y-2">
                                <div class="font-bold border-b border-slate-200 dark:border-slate-700 pb-1 text-slate-500">해설</div>
                                <div class="whitespace-pre-line">${q.explanation || '해설이 제공되지 않는 문제입니다.'}</div>
                            </div>
                        </div>
                    `;
                }

                item.innerHTML = `
                    <div class="bg-white dark:bg-slate-800 rounded-3xl p-6 md:p-8 shadow-sm border border-slate-200 dark:border-slate-700 min-h-[380px] flex flex-col justify-between transition-colors">
                        <div>
                            <div class="text-xs font-bold text-blue-600 dark:text-blue-400 mb-1">Question ${idx + 1}</div>
                            <h3 class="font-bold text-slate-800 dark:text-slate-100 text-base md:text-lg leading-snug">
                                ${q.question}
                            </h3>
                            ${optionsHTML}
                        </div>
                        ${explanationHTML}
                    </div>
                `;
                container.appendChild(item);
            });

            renderMath();
        }

        function selectOption(qId, optNum) {
            if (isAnswerLocked[qId]) return;

            userAnswers[qId] = optNum;

            if (examMode === 'practice') {
                isAnswerLocked[qId] = true;
            }

            renderSlides();
            renderOMR();
        }

        function updateSlidePosition() {
            const container = document.getElementById('slideContainer');
            container.style.transform = `translateX(-${currentIndex * 100}%)`;

            const currentQ = currentQuestions[currentIndex];
            document.getElementById('currentQuestionNum').textContent = currentIndex + 1;
            document.getElementById('currentCategoryBadge').textContent = currentQ ? (currentQ.category || "일반") : "";

            document.getElementById('btnPrevQ').disabled = (currentIndex === 0);
            const btnNext = document.getElementById('btnNextQ');
            if (currentIndex === currentQuestions.length - 1) {
                btnNext.innerHTML = `<span>제출하기</span> <i class="fa-solid fa-paper-plane"></i>`;
                btnNext.onclick = submitExamPrompt;
            } else {
                btnNext.innerHTML = `<span>다음 문제</span> <i class="fa-solid fa-chevron-right"></i>`;
                btnNext.onclick = nextQuestion;
            }

            renderOMRHighlight();
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                updateSlidePosition();
            }
        }

        function nextQuestion() {
            if (currentIndex < currentQuestions.length - 1) {
                currentIndex++;
                updateSlidePosition();
            }
        }

        function goToQuestion(index) {
            if (index >= 0 && index < currentQuestions.length) {
                currentIndex = index;
                updateSlidePosition();
                if (window.innerWidth < 1024) {
                    toggleMobileOmr(false);
                }
            }
        }

        function renderOMR() {
            const grid = document.getElementById('omrGrid');
            grid.innerHTML = '';

            let answeredCount = 0;

            currentQuestions.forEach((q, idx) => {
                const isAnswered = userAnswers[q.id] !== undefined;
                if (isAnswered) answeredCount++;

                const item = document.createElement('div');
                item.id = `omr-item-${idx}`;
                item.className = `flex items-center justify-between p-2 rounded-xl transition border ${
                    idx === currentIndex 
                    ? 'bg-blue-50/80 dark:bg-blue-900/30 border-blue-400 dark:border-blue-600' 
                    : 'border-transparent hover:bg-slate-50 dark:hover:bg-slate-700/50'
                }`;

                let numbersHTML = '<div class="flex space-x-1">';
                for (let i = 1; i <= 4; i++) {
                    const selected = userAnswers[q.id] === i;
                    const isLocked = isAnswerLocked[q.id] || false;

                    let btnStyle = "border-slate-300 dark:border-slate-600 text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-600";
                    if (selected) {
                        btnStyle = "bg-blue-600 border-blue-600 text-white shadow-xs font-bold";
                    }

                    numbersHTML += `
                        <button onclick="selectOption(${q.id}, ${i}); goToQuestion(${idx});" ${isLocked ? 'disabled' : ''} class="w-6 h-6 rounded-full border text-xs flex items-center justify-center transition ${btnStyle}">
                            ${i}
                        </button>
                    `;
                }
                numbersHTML += '</div>';

                item.innerHTML = `
                    <button onclick="goToQuestion(${idx})" class="text-xs font-bold ${idx === currentIndex ? 'text-blue-600 dark:text-blue-400' : 'text-slate-600 dark:text-slate-400'} w-8 text-left">
                        ${idx + 1}.
                    </button>
                    ${numbersHTML}
                `;
                grid.appendChild(item);
            });

            document.getElementById('answeredCount').textContent = answeredCount;
            document.getElementById('omrTotalCount').textContent = currentQuestions.length;
        }

        function renderOMRHighlight() {
            currentQuestions.forEach((_, idx) => {
                const item = document.getElementById(`omr-item-${idx}`);
                if (item) {
                    if (idx === currentIndex) {
                        item.classList.add('bg-blue-50/80', 'dark:bg-blue-900/30', 'border-blue-400', 'dark:border-blue-600');
                        item.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                    } else {
                        item.classList.remove('bg-blue-50/80', 'dark:bg-blue-900/30', 'border-blue-400', 'dark:border-blue-600');
                    }
                }
            });
        }

        function toggleMobileOmr(forceState) {
            const drawer = document.getElementById('omrDrawer');
            if (typeof forceState === 'boolean') {
                if (forceState) drawer.classList.remove('hidden');
                else drawer.classList.add('hidden');
            } else {
                drawer.classList.toggle('hidden');
            }
        }

        function setupKeyboardNav() {
            window.addEventListener('keydown', (e) => {
                // PIN 오버레이가 활성화된 동안에는 CBT 단축키 차단
                if (pinOverlay.style.display !== 'none') return;

                const examScreen = document.getElementById('examScreen');
                if (examScreen.classList.contains('hidden')) return;

                if (e.key === 'ArrowLeft') prevQuestion();
                if (e.key === 'ArrowRight') nextQuestion();
                if (['1', '2', '3', '4'].includes(e.key)) {
                    const currentQ = currentQuestions[currentIndex];
                    if (currentQ) selectOption(currentQ.id, parseInt(e.key));
                }
            });
        }

        function setupSwipeNav() {
            const container = document.getElementById('slideContainer');
            container.addEventListener('touchstart', (e) => {
                if (pinOverlay.style.display !== 'none') return;
                touchStartX = e.changedTouches[0].screenX;
            }, { passive: true });

            container.addEventListener('touchend', (e) => {
                if (pinOverlay.style.display !== 'none') return;
                touchEndX = e.changedTouches[0].screenX;
                handleSwipe();
            }, { passive: true });
        }

        function handleSwipe() {
            const diff = touchEndX - touchStartX;
            if (Math.abs(diff) > 50) {
                if (diff < 0) nextQuestion();
                else prevQuestion();
            }
        }

        function startTimer() {
            clearInterval(timerInterval);
            updateTimerDisplay();
            timerInterval = setInterval(() => {
                timeRemaining--;
                updateTimerDisplay();
                if (timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    showModal("시간 종료", "시험 시간이 종료되어 답안이 자동 제출됩니다.", [{
                        text: "결과 확인", bg: "bg-red-600", action: () => { closeModal(); submitExam(); }
                    }]);
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const minutes = Math.floor(timeRemaining / 60);
            const seconds = timeRemaining % 60;
            document.getElementById('timer').textContent = 
                `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        function submitExamPrompt() {
            const answered = Object.keys(userAnswers).length;
            const unanswered = currentQuestions.length - answered;
            let msg = `총 ${currentQuestions.length}문제 중 ${answered}문제를 작성하셨습니다.`;
            if (unanswered > 0) {
                msg += `\n(미풀이 문제: ${unanswered}개)`;
            }
            msg += "\n\n정말로 답안을 제출하시겠습니까?";

            showModal("답안 제출 확인", msg, [
                { text: "취소", bg: "bg-slate-400", action: closeModal },
                { text: "제출하기", bg: "bg-emerald-600", action: () => { closeModal(); submitExam(); } }
            ]);
        }

        function submitExam() {
            clearInterval(timerInterval);

            currentQuestions.forEach(q => {
                isAnswerLocked[q.id] = true;
            });

            let correctCount = 0;
            const categoryStats = {};

            currentQuestions.forEach(q => {
                const userAns = userAnswers[q.id];
                const isCorrect = userAns === q.answer;

                if (isCorrect) correctCount++;

                const cat = q.category || '일반';
                if (!categoryStats[cat]) {
                    categoryStats[cat] = { total: 0, correct: 0 };
                }
                categoryStats[cat].total++;
                if (isCorrect) categoryStats[cat].correct++;
            });

            const score = Math.round((correctCount / currentQuestions.length) * 100);
            const isPass = score >= 60;

            document.getElementById('examScreen').classList.add('hidden');
            document.getElementById('resultScreen').classList.remove('hidden');

            const passBadge = document.getElementById('passBadge');
            if (isPass) {
                passBadge.className = "inline-block px-4 py-1.5 rounded-full text-xs font-extrabold mb-3 bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300";
                passBadge.innerHTML = '<i class="fa-solid fa-trophy mr-1"></i> 합격 (60점 이상)';
            } else {
                passBadge.className = "inline-block px-4 py-1.5 rounded-full text-xs font-extrabold mb-3 bg-red-100 text-red-800 dark:bg-red-950 dark:text-red-300";
                passBadge.innerHTML = '<i class="fa-solid fa-triangle-exclamation mr-1"></i> 불합격 (60점 미만)';
            }

            document.getElementById('scoreDisplay').textContent = score;
            document.getElementById('scoreSubText').textContent = `맞힌 문제: ${correctCount} / ${currentQuestions.length}개`;

            const subjectContainer = document.getElementById('subjectScoreList');
            subjectContainer.innerHTML = '';

            for (const [cat, stat] of Object.entries(categoryStats)) {
                const catScore = Math.round((stat.correct / stat.total) * 100);
                const card = document.createElement('div');
                card.className = "bg-slate-50 dark:bg-slate-900 p-4 rounded-2xl border border-slate-200 dark:border-slate-700/80";
                card.innerHTML = `
                    <div class="text-xs font-bold text-slate-400 mb-1">${cat}</div>
                    <div class="flex justify-between items-baseline font-mono">
                        <span class="text-base font-bold">${stat.correct} / ${stat.total}</span>
                        <span class="text-sm font-extrabold ${catScore >= 60 ? 'text-emerald-600 dark:text-emerald-400' : 'text-red-500'}">${catScore}점</span>
                    </div>
                    <div class="w-full bg-slate-200 dark:bg-slate-700 h-2 rounded-full mt-2 overflow-hidden">
                        <div class="h-full ${catScore >= 60 ? 'bg-emerald-500' : 'bg-red-500'}" style="width: ${catScore}%"></div>
                    </div>
                `;
                subjectContainer.appendChild(card);
            }
        }

        function reviewWrongAnswersOnly() {
            examMode = "practice";
            document.getElementById('resultScreen').classList.add('hidden');
            document.getElementById('examScreen').classList.remove('hidden');

            const wrongIdx = currentQuestions.findIndex(q => userAnswers[q.id] !== q.answer);
            currentIndex = wrongIdx !== -1 ? wrongIdx : 0;

            renderSlides();
            renderOMR();
            updateSlidePosition();
        }

        function reviewAllAnswers() {
            examMode = "practice";
            document.getElementById('resultScreen').classList.add('hidden');
            document.getElementById('examScreen').classList.remove('hidden');

            currentIndex = 0;
            renderSlides();
            renderOMR();
            updateSlidePosition();
        }

        function resetToStart() {
            clearInterval(timerInterval);
            document.getElementById('resultScreen').classList.add('hidden');
            document.getElementById('examScreen').classList.add('hidden');
            document.getElementById('startScreen').classList.remove('hidden');
            document.getElementById('timerContainer').classList.add('hidden');
        }

        function changeFontSize(delta) {
            fontSizeLevel = Math.max(0, Math.min(3, fontSizeLevel + delta));
            applyFontSize();
        }

        function resetFontSize() {
            fontSizeLevel = 1;
            applyFontSize();
        }

        function applyFontSize() {
            const body = document.body;
            fontSizeClasses.forEach(cls => body.classList.remove(cls));
            body.classList.add(fontSizeClasses[fontSizeLevel]);
        }

        function renderMath() {
            if (window.renderMathInElement) {
                renderMathInElement(document.body, {
                    delimiters: [
                        {left: '$$', right: '$$', display: true},
                        {left: '$', right: '$', display: false}
                    ],
                    throwOnError : false
                });
            }
        }

        function showModal(title, message, buttons) {
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalMessage').textContent = message;
            
            const btnContainer = document.getElementById('modalButtons');
            btnContainer.innerHTML = '';

            buttons.forEach(b => {
                const btn = document.createElement('button');
                btn.className = `${b.bg} hover:opacity-90 text-white font-bold px-4 py-2 rounded-xl text-xs sm:text-sm transition`;
                btn.textContent = b.text;
                btn.onclick = b.action;
                btnContainer.appendChild(btn);
            });

            document.getElementById('modalBackdrop').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modalBackdrop').classList.add('hidden');
        }
    </script>
</body>
</html>
