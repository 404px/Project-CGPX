<!DOCTYPE html>
<html lang="ko" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>승강기기능사 CBT 시험장 Remastered</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Pretendard', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'Roboto', 'sans-serif'],
                    },
                    colors: {
                        cbt: {
                            50: '#f0f7ff',
                            100: '#e0effe',
                            500: '#2563eb',
                            600: '#1d4ed8',
                            700: '#1e40af',
                            800: '#1e3a8a',
                            900: '#172554',
                        }
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        
        body { 
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; 
            user-select: none;
            -webkit-user-select: none;
        }
        
        .cbt-text-sm .exam-content-text { font-size: 0.875rem !important; line-height: 1.5; }
        .cbt-text-base .exam-content-text { font-size: 1rem !important; line-height: 1.6; }
        .cbt-text-lg .exam-content-text { font-size: 1.125rem !important; line-height: 1.65; }
        .cbt-text-xl .exam-content-text { font-size: 1.25rem !important; line-height: 1.7; }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }

        .slide-container {
            display: flex;
            transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
            will-change: transform;
        }

        .slide-item {
            flex: 0 0 100%;
            width: 100%;
        }

        .katex-display { margin: 0.5em 0 !important; overflow-x: auto; overflow-y: hidden; }

        #pin-overlay {
            position: fixed;
            inset: 0;
            background-color: rgba(15, 23, 42, 0.96);
            backdrop-filter: blur(16px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 16px;
        }

        .pin-card {
            background: #1e293b;
            border: 1px solid #334155;
            padding: 32px 24px;
            border-radius: 28px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
            text-align: center;
            max-width: 380px;
            width: 100%;
            color: #f8fafc;
        }

        .pin-digit {
            width: 52px;
            height: 60px;
            border: 2px solid #334155;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            font-weight: 700;
            color: #38bdf8;
            background: #0f172a;
            transition: all 0.15s ease;
        }

        .pin-digit.active {
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.25);
        }

        .pin-digit.filled {
            border-color: #0284c7;
            background: #0369a1;
            color: #ffffff;
        }

        .shake {
            animation: shake 0.4s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 dark:bg-slate-900 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-200 cbt-text-base">

    <div id="pin-overlay">
        <div class="pin-card" id="pin-card">
            <div class="w-12 h-12 bg-blue-600/20 text-blue-400 rounded-2xl flex items-center justify-center mx-auto mb-3 text-xl border border-blue-500/30">
                <i class="fa-solid fa-lock"></i>
            </div>
            <h2 class="text-xl font-bold mb-1 text-white">보안 인증</h2>
            <p id="sub-title" class="text-xs text-slate-400 mb-5">수험자 확인을 위해 PIN 4자리를 입력하세요.</p>
            
            <div class="relative mb-4 flex justify-center gap-3">
                <div class="pin-digit" id="digit-0"></div>
                <div class="pin-digit" id="digit-1"></div>
                <div class="pin-digit" id="digit-2"></div>
                <div class="pin-digit" id="digit-3"></div>
                
                <input type="password" id="real-pin" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full" maxlength="4" inputmode="numeric" pattern="[0-9]*" autocomplete="off" autofocus>
            </div>

            <div id="status-msg" class="text-xs min-h-[20px] font-semibold mb-4 text-rose-400"></div>

            <div class="grid grid-cols-3 gap-2 max-w-[260px] mx-auto mt-2">
                <button type="button" onclick="pressPad('1')" class="py-2.5 bg-slate-800 hover:bg-slate-700 active:bg-slate-600 rounded-xl font-bold text-lg text-slate-200 transition">1</button>
                <button type="button" onclick="pressPad('2')" class="py-2.5 bg-slate-800 hover:bg-slate-700 active:bg-slate-600 rounded-xl font-bold text-lg text-slate-200 transition">2</button>
                <button type="button" onclick="pressPad('3')" class="py-2.5 bg-slate-800 hover:bg-slate-700 active:bg-slate-600 rounded-xl font-bold text-lg text-slate-200 transition">3</button>
                <button type="button" onclick="pressPad('4')" class="py-2.5 bg-slate-800 hover:bg-slate-700 active:bg-slate-600 rounded-xl font-bold text-lg text-slate-200 transition">4</button>
                <button type="button" onclick="pressPad('5')" class="py-2.5 bg-slate-800 hover:bg-slate-700 active:bg-slate-600 rounded-xl font-bold text-lg text-slate-200 transition">5</button>
                <button type="button" onclick="pressPad('6')" class="py-2.5 bg-slate-800 hover:bg-slate-700 active:bg-slate-600 rounded-xl font-bold text-lg text-slate-200 transition">6</button>
                <button type="button" onclick="pressPad('7')" class="py-2.5 bg-slate-800 hover:bg-slate-700 active:bg-slate-600 rounded-xl font-bold text-lg text-slate-200 transition">7</button>
                <button type="button" onclick="pressPad('8')" class="py-2.5 bg-slate-800 hover:bg-slate-700 active:bg-slate-600 rounded-xl font-bold text-lg text-slate-200 transition">8</button>
                <button type="button" onclick="pressPad('9')" class="py-2.5 bg-slate-800 hover:bg-slate-700 active:bg-slate-600 rounded-xl font-bold text-lg text-slate-200 transition">9</button>
                <button type="button" onclick="pressPad('clear')" class="py-2.5 bg-slate-800/80 hover:bg-slate-700 text-slate-400 rounded-xl font-medium text-xs transition">전체취소</button>
                <button type="button" onclick="pressPad('0')" class="py-2.5 bg-slate-800 hover:bg-slate-700 active:bg-slate-600 rounded-xl font-bold text-lg text-slate-200 transition">0</button>
                <button type="button" onclick="pressPad('back')" class="py-2.5 bg-slate-800/80 hover:bg-slate-700 text-slate-400 rounded-xl font-bold text-sm transition"><i class="fa-solid fa-delete-left"></i></button>
            </div>
        </div>
    </div>

    <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 sticky top-0 z-30 transition-colors shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-2.5 flex justify-between items-center">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="resetToStart()">
                <div class="w-9 h-9 rounded-xl bg-blue-600 text-white flex items-center justify-center font-bold text-lg shadow-md shadow-blue-500/20">
                    <i class="fa-solid fa-elevator"></i>
                </div>
                <div>
                    <h1 class="font-bold text-sm md:text-base tracking-tight text-slate-900 dark:text-white" id="headerTitle">승강기기능사 CBT</h1>
                    <p class="text-[10px] text-slate-400 font-medium hidden sm:block">실전 컴퓨터 기반 응시 테스트 시스템</p>
                </div>
            </div>
            
            <div class="flex items-center space-x-2">
                <button onclick="toggleSound()" id="soundBtn" class="w-8 h-8 md:w-9 md:h-9 rounded-xl bg-slate-100 dark:bg-slate-700/70 flex items-center justify-center text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-600 transition" title="음향 효과 토글">
                    <i id="soundIcon" class="fa-solid fa-volume-high text-xs md:text-sm"></i>
                </button>

                <div class="hidden sm:flex items-center bg-slate-100 dark:bg-slate-700/60 rounded-xl p-1 text-xs">
                    <button onclick="changeFontSize(-1)" class="px-2 py-1 rounded-lg hover:bg-white dark:hover:bg-slate-600 font-bold transition text-slate-600 dark:text-slate-300" title="글자 축소">A-</button>
                    <button onclick="resetFontSize()" class="px-2 py-1 rounded-lg hover:bg-white dark:hover:bg-slate-600 font-bold transition text-slate-600 dark:text-slate-300" title="기본 크기">A</button>
                    <button onclick="changeFontSize(1)" class="px-2 py-1 rounded-lg hover:bg-white dark:hover:bg-slate-600 font-bold transition text-slate-600 dark:text-slate-300" title="글자 확대">A+</button>
                </div>

                <button onclick="toggleDarkMode()" class="w-8 h-8 md:w-9 md:h-9 rounded-xl bg-slate-100 dark:bg-slate-700/70 flex items-center justify-center text-slate-600 dark:text-amber-400 hover:bg-slate-200 dark:hover:bg-slate-600 transition" title="화면 테마 전환">
                    <i id="darkModeIcon" class="fa-solid fa-moon text-xs md:text-sm"></i>
                </button>

                <button onclick="toggleFullScreen()" class="hidden md:flex w-9 h-9 rounded-xl bg-slate-100 dark:bg-slate-700/70 items-center justify-center text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-600 transition" title="전체화면">
                    <i class="fa-solid fa-expand text-xs"></i>
                </button>

                <div id="timerContainer" class="hidden flex items-center bg-rose-500/10 dark:bg-rose-950/40 border border-rose-200 dark:border-rose-800/70 text-rose-600 dark:text-rose-400 px-3 py-1.5 rounded-xl font-mono font-bold text-xs md:text-sm">
                    <i class="fa-regular fa-clock mr-1.5 animate-pulse"></i>
                    <span id="timer">60:00</span>
                </div>
            </div>
        </div>

        <div id="progressBarContainer" class="hidden w-full bg-slate-200 dark:bg-slate-700 h-1">
            <div id="progressBar" class="bg-blue-600 h-1 transition-all duration-300" style="width: 0%"></div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-3 sm:p-4 md:p-6 flex flex-col justify-center">
        
        <!-- 1. Start Screen -->
        <div id="startScreen" class="max-w-xl mx-auto w-full bg-white dark:bg-slate-800 rounded-3xl shadow-xl p-6 md:p-8 border border-slate-200 dark:border-slate-700 transition-colors">
            <div class="text-center mb-6">
                <span class="inline-block bg-blue-100 text-blue-800 dark:bg-blue-950 dark:text-blue-300 text-[11px] font-extrabold px-3 py-1 rounded-full uppercase tracking-wider mb-2">
                    CBT Remastered v2.7
                </span>
                <h2 class="text-2xl md:text-3xl font-black text-slate-900 dark:text-white">승강기기능사 필기</h2>
                <p class="text-xs md:text-sm text-slate-500 dark:text-slate-400 mt-1.5">시험 회차와 응시 모드를 선택한 후 시험을 시작하세요.</p>
            </div>

            <div class="space-y-5">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider mb-2 text-slate-500 dark:text-slate-400">
                        <i class="fa-solid fa-list-ol mr-1 text-blue-500"></i> 1. 시험 회차 선택
                    </label>
                    <div class="relative">
                        <select id="examSelect" class="w-full p-3.5 rounded-2xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 font-medium focus:ring-2 focus:ring-blue-500 focus:outline-none transition appearance-none cursor-pointer text-sm">
                            <option value="" disabled selected>목록을 불러오는 중...</option>
                        </select>
                        <div class="absolute right-4 top-4 pointer-events-none text-slate-400">
                            <i class="fa-solid fa-chevron-down text-xs"></i>
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider mb-2 text-slate-500 dark:text-slate-400">
                        <i class="fa-solid fa-sliders mr-1 text-blue-500"></i> 2. 응시 모드 선택
                    </label>
                    <div class="grid grid-cols-2 gap-3">
                        <label class="border-2 border-slate-200 dark:border-slate-700 rounded-2xl p-4 cursor-pointer hover:border-blue-500 dark:hover:border-blue-500 transition flex flex-col items-center text-center has-[:checked]:border-blue-600 has-[:checked]:bg-blue-50/50 dark:has-[:checked]:bg-blue-900/20">
                            <input type="radio" name="examMode" value="exam" checked class="hidden">
                            <i class="fa-solid fa-stopwatch text-2xl text-blue-600 dark:text-blue-400 mb-2"></i>
                            <span class="font-bold text-sm text-slate-800 dark:text-slate-100">실전 모의고사</span>
                            <span class="text-[11px] text-slate-500 dark:text-slate-400 mt-1">60분 제한시간<br>최종 제출 후 채점</span>
                        </label>
                        <label class="border-2 border-slate-200 dark:border-slate-700 rounded-2xl p-4 cursor-pointer hover:border-blue-500 dark:hover:border-blue-500 transition flex flex-col items-center text-center has-[:checked]:border-blue-600 has-[:checked]:bg-blue-50/50 dark:has-[:checked]:bg-blue-900/20">
                            <input type="radio" name="examMode" value="practice" class="hidden">
                            <i class="fa-solid fa-book-open text-2xl text-emerald-600 dark:text-emerald-400 mb-2"></i>
                            <span class="font-bold text-sm text-slate-800 dark:text-slate-100">연습/학습 모드</span>
                            <span class="text-[11px] text-slate-500 dark:text-slate-400 mt-1">제한시간 없음<br>즉시 정답 및 해설</span>
                        </label>
                    </div>
                </div>

                <div class="bg-slate-50 dark:bg-slate-900/60 p-4 rounded-2xl border border-slate-200 dark:border-slate-700/80 text-xs text-slate-600 dark:text-slate-400 space-y-1.5">
                    <div class="font-bold text-slate-700 dark:text-slate-300 mb-1 flex items-center">
                        <i class="fa-solid fa-circle-info text-blue-500 mr-1.5"></i> 응시 유의사항
                    </div>
                    <p>• 총 60문항 / 60분 (100점 만점 중 60점 이상 합격)</p>
                    <p>• 키보드 방향키 및 숫자키(1~4)로 빠르게 이동 및 마킹할 수 있습니다.</p>
                </div>

                <button id="btnStart" onclick="startExam()" class="w-full bg-blue-600 hover:bg-blue-700 active:scale-[0.99] text-white font-bold py-4 rounded-2xl shadow-lg shadow-blue-500/25 transition duration-200 text-base flex items-center justify-center space-x-2">
                    <span id="btnStartText">시험 시작하기</span>
                    <i id="btnStartIcon" class="fa-solid fa-arrow-right"></i>
                </button>
            </div>
        </div>

        <!-- 2. Exam Screen -->
        <div id="examScreen" class="hidden grid grid-cols-1 lg:grid-cols-4 gap-6 items-start">
            
            <div class="lg:col-span-3 space-y-4">
                <div class="bg-white dark:bg-slate-800 p-3.5 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 flex justify-between items-center">
                    <div class="flex items-center space-x-2">
                        <span id="currentCategoryBadge" class="bg-blue-100 text-blue-800 dark:bg-blue-900/60 dark:text-blue-300 text-xs font-bold px-3 py-1 rounded-lg">
                            과목
                        </span>
                        
                        <button id="flagBtn" onclick="toggleFlagCurrentQuestion()" class="px-2.5 py-1 rounded-lg border border-slate-200 dark:border-slate-700 text-xs font-bold transition flex items-center space-x-1.5 text-slate-500 hover:bg-slate-50 dark:hover:bg-slate-700">
                            <i class="fa-solid fa-bookmark" id="flagIcon"></i>
                            <span id="flagText">나중에 풀기</span>
                        </button>
                    </div>
                    
                    <div class="flex items-center space-x-3 font-mono font-bold text-sm">
                        <span class="text-slate-400 text-xs hidden sm:inline">문항 위치</span>
                        <span class="bg-slate-100 dark:bg-slate-700 px-3 py-1 rounded-lg text-slate-700 dark:text-slate-200">
                            <span id="currentQuestionNum" class="text-blue-600 dark:text-blue-400">1</span> / <span id="totalQuestionsCount">60</span>
                        </span>
                    </div>
                </div>

                <div class="overflow-hidden rounded-3xl relative min-h-[420px] bg-transparent">
                    <div id="slideContainer" class="slide-container"></div>
                </div>

                <div class="bg-white dark:bg-slate-800 p-3.5 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 flex justify-between items-center">
                    <button id="btnPrevQ" onclick="prevQuestion()" class="bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 font-bold px-4 py-2.5 rounded-xl text-sm transition flex items-center space-x-2 disabled:opacity-40">
                        <i class="fa-solid fa-chevron-left"></i>
                        <span>이전 문제</span>
                    </button>
                    
                    <button onclick="toggleMobileOmr()" class="lg:hidden bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 font-bold px-3.5 py-2.5 rounded-xl text-xs flex items-center">
                        <i class="fa-solid fa-list-check mr-1.5 text-blue-500"></i> OMR 답안지
                    </button>

                    <button id="btnNextQ" onclick="nextQuestion()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-5 py-2.5 rounded-xl text-sm transition flex items-center space-x-2 shadow-md shadow-blue-500/20">
                        <span>다음 문제</span>
                        <i class="fa-solid fa-chevron-right"></i>
                    </button>
                </div>
            </div>

            <div id="omrDrawer" class="fixed lg:static inset-0 z-40 bg-slate-900/60 lg:bg-transparent backdrop-blur-xs lg:backdrop-blur-none hidden lg:block lg:col-span-1">
                <div class="bg-white dark:bg-slate-800 rounded-3xl shadow-xl lg:shadow-md border border-slate-200 dark:border-slate-700 p-4 font-sans fixed lg:sticky bottom-0 left-0 right-0 max-h-[82vh] lg:max-h-[calc(100vh-5.5rem)] top-auto lg:top-20 flex flex-col transition-all">
                    
                    <div class="flex justify-between items-center pb-3 border-b border-slate-200 dark:border-slate-700 mb-2">
                        <h3 class="font-bold text-sm text-slate-800 dark:text-slate-200 flex items-center" id="omrTitleHeader">
                            <i class="fa-solid fa-list-check text-blue-600 dark:text-blue-400 mr-2"></i> OMR 답안지
                        </h3>
                        <div class="flex items-center space-x-2">
                            <span class="text-xs bg-slate-100 dark:bg-slate-700 px-2.5 py-1 rounded-lg text-slate-600 dark:text-slate-300 font-bold font-mono">
                                <span id="answeredCount" class="text-blue-600 dark:text-blue-400">0</span> / <span id="omrTotalCount">60</span>
                            </span>
                            <button onclick="toggleMobileOmr(false)" class="lg:hidden text-slate-400 hover:text-slate-600 p-1">
                                <i class="fa-solid fa-xmark text-lg"></i>
                            </button>
                        </div>
                    </div>

                    <div id="omrFilterContainer" class="flex bg-slate-100 dark:bg-slate-900 p-1 rounded-xl mb-3 text-[11px] font-bold"></div>

                    <div id="omrGrid" class="flex-1 overflow-y-auto space-y-1.5 pr-1"></div>

                    <div id="omrSubmitContainer" class="pt-3 border-t border-slate-200 dark:border-slate-700 mt-2">
                        <button onclick="submitExamPrompt()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow-md transition text-sm flex items-center justify-center space-x-2">
                            <i class="fa-solid fa-paper-plane"></i>
                            <span>답안 최종 제출</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 3. Result Screen -->
        <div id="resultScreen" class="hidden max-w-3xl mx-auto w-full bg-white dark:bg-slate-800 rounded-3xl shadow-xl p-6 md:p-8 border border-slate-200 dark:border-slate-700 my-4 transition-colors">
            <div class="text-center pb-6 border-b border-slate-200 dark:border-slate-700 mb-6">
                <div id="passBadge" class="inline-block px-4 py-1.5 rounded-full text-xs font-extrabold mb-3"></div>
                <h2 class="text-2xl md:text-3xl font-black text-slate-900 dark:text-white">최종 채점 결과</h2>
                <div class="flex justify-center items-baseline space-x-2 mt-4 font-mono">
                    <span id="scoreDisplay" class="text-5xl font-black text-blue-600 dark:text-blue-400">0</span>
                    <span class="text-lg text-slate-400 font-bold">/ 100점</span>
                </div>
                <p id="scoreSubText" class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mt-2 font-medium"></p>
            </div>

            <div class="mb-8">
                <h3 class="font-bold text-xs uppercase tracking-wider text-slate-400 mb-3 flex items-center">
                    <i class="fa-solid fa-chart-pie text-blue-500 mr-2"></i> 과목별 성적 분석
                </h3>
                <div id="subjectScoreList" class="grid grid-cols-1 md:grid-cols-3 gap-3"></div>
            </div>

            <div class="flex flex-col sm:flex-row justify-center gap-3">
                <button onclick="reviewAllAnswers()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-5 py-3 rounded-xl shadow transition text-sm flex items-center justify-center">
                    <i class="fa-solid fa-check-double mr-2"></i> 전체 해설 보기
                </button>
                <button onclick="resetToStart()" class="bg-slate-600 hover:bg-slate-700 text-white font-bold px-5 py-3 rounded-xl shadow transition text-sm flex items-center justify-center">
                    <i class="fa-solid fa-rotate-left mr-2"></i> 시험 메인으로
                </button>
            </div>
        </div>

    </main>

    <div id="modalBackdrop" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-800 rounded-3xl max-w-sm w-full p-6 shadow-2xl border border-slate-200 dark:border-slate-700 transition-all">
            <h3 id="modalTitle" class="text-lg font-bold mb-2 text-slate-900 dark:text-white">알림</h3>
            <p id="modalMessage" class="text-slate-600 dark:text-slate-300 text-xs sm:text-sm mb-6 whitespace-pre-line leading-relaxed"></p>
            <div id="modalButtons" class="flex justify-end space-x-2"></div>
        </div>
    </div>

    <script>
        const CORRECT_PIN = "8250";
        const MAX_ATTEMPTS = 5;
        const LOCKOUT_SECONDS = 30;

        let failedAttempts = 0;
        let pinTimerInterval = null;

        const realPinInput = document.getElementById('real-pin');
        const pinOverlay = document.getElementById('pin-overlay');
        const statusMsg = document.getElementById('status-msg');
        const pinCard = document.getElementById('pin-card');
        const digitBoxes = [
            document.getElementById('digit-0'),
            document.getElementById('digit-1'),
            document.getElementById('digit-2'),
            document.getElementById('digit-3')
        ];

        function setCookie(name, value, seconds) {
            let expires = "";
            if (seconds) {
                const date = new Date();
                date.setTime(date.getTime() + (seconds * 1000));
                expires = "; expires=" + date.toUTCString();
            }
            document.cookie = name + "=" + (value || "") + expires + "; path=/; SameSite=Lax";
        }

        function getCookie(name) {
            const nameEQ = name + "=";
            const ca = document.cookie.split(';');
            for(let i = 0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) === ' ') c = c.substring(1, c.length);
                if (c.indexOf(nameEQ) === 0) return c.substring(nameEQ.length, c.length);
            }
            return null;
        }

        function deleteCookie(name) {
            document.cookie = name +'=; Path=/; Expires=Thu, 01 Jan 1970 00:00:01 GMT;';
        }

        function checkLockoutState() {
            const lockoutUntil = getCookie("pin_lockout_until");
            if (lockoutUntil) {
                const remainingMs = parseInt(lockoutUntil, 10) - Date.now();
                if (remainingMs > 0) {
                    startLockout(Math.ceil(remainingMs / 1000));
                } else {
                    deleteCookie("pin_lockout_until");
                    unlockInput();
                }
            } else {
                unlockInput();
            }
        }

        function updatePinDisplay(val) {
            digitBoxes.forEach((box, index) => {
                if (index < val.length) {
                    box.textContent = '•';
                    box.classList.add('filled');
                    box.classList.remove('active');
                } else if (index === val.length) {
                    box.textContent = '';
                    box.classList.remove('filled');
                    box.classList.add('active');
                } else {
                    box.textContent = '';
                    box.classList.remove('filled', 'active');
                }
            });
        }

        realPinInput.addEventListener('input', function(e) {
            e.stopPropagation();
            const value = this.value;
            updatePinDisplay(value);

            if (value.length === 4) {
                verifyPin(value);
            }
        });

        function pressPad(key) {
            if (realPinInput.disabled) return;
            let current = realPinInput.value;
            
            if (key === 'clear') {
                current = '';
            } else if (key === 'back') {
                current = current.slice(0, -1);
            } else if (current.length < 4) {
                current += key;
            }
            
            realPinInput.value = current;
            updatePinDisplay(current);

            if (current.length === 4) {
                verifyPin(current);
            }
        }

        function verifyPin(enteredPin) {
            if (enteredPin === CORRECT_PIN) {
                deleteCookie("pin_lockout_until");
                pinOverlay.style.display = 'none';
                playAudioTone(800, 0.1);
            } else {
                failedAttempts++;
                realPinInput.value = '';
                resetBoxes();
                playAudioTone(200, 0.25);

                if (failedAttempts >= MAX_ATTEMPTS) {
                    const lockoutUntil = Date.now() + (LOCKOUT_SECONDS * 1000);
                    setCookie("pin_lockout_until", lockoutUntil, LOCKOUT_SECONDS);
                    startLockout(LOCKOUT_SECONDS);
                } else {
                    triggerShake();
                    statusMsg.textContent = `PIN이 일치하지 않습니다. (${failedAttempts}/${MAX_ATTEMPTS})`;
                }
            }
        }

        function resetBoxes() {
            digitBoxes.forEach((box, index) => {
                box.textContent = '';
                box.classList.remove('filled', 'active');
                if (index === 0) box.classList.add('active');
            });
        }

        function triggerShake() {
            pinCard.classList.remove('shake');
            void pinCard.offsetWidth;
            pinCard.classList.add('shake');
        }

        function startLockout(seconds) {
            realPinInput.disabled = true;
            realPinInput.value = '';
            resetBoxes();
            
            digitBoxes.forEach(box => box.classList.remove('active'));

            let remaining = seconds;
            statusMsg.textContent = `5회 연속 실패. ${remaining}초 후 다시 시도하세요.`;

            if (pinTimerInterval) clearInterval(pinTimerInterval);

            pinTimerInterval = setInterval(() => {
                remaining--;
                if (remaining > 0) {
                    statusMsg.textContent = `5회 연속 실패. ${remaining}초 후 다시 시도하세요.`;
                } else {
                    clearInterval(pinTimerInterval);
                    deleteCookie("pin_lockout_until");
                    unlockInput();
                }
            }, 1000);
        }

        function unlockInput() {
            failedAttempts = 0;
            realPinInput.disabled = false;
            statusMsg.textContent = '';
            resetBoxes();
            realPinInput.focus();
        }

        let isSoundOn = true;
        let audioCtx = null;

        function playAudioTone(freq, duration) {
            if (!isSoundOn) return;
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {
                console.log("Audio not allowed yet");
            }
        }

        function toggleSound() {
            isSoundOn = !isSoundOn;
            const icon = document.getElementById('soundIcon');
            if (isSoundOn) {
                icon.className = "fa-solid fa-volume-high text-xs md:text-sm";
            } else {
                icon.className = "fa-solid fa-volume-xmark text-xs md:text-sm text-slate-400";
            }
        }

        let examListMap = {};
        let originalQuestions = [];
        let currentQuestions = [];
        let userAnswers = {};        
        let flaggedQuestions = {};   
        let isAnswerLocked = {};     
        let currentIndex = 0;
        let examMode = "exam";
        let isSubmitted = false;
        let omrFilter = "all";       
        let timerInterval = null;
        let timeRemaining = 3600;
        let fontSizeLevel = 1;
        const fontSizeClasses = ['cbt-text-sm', 'cbt-text-base', 'cbt-text-lg', 'cbt-text-xl'];
        let selectedExamKey = "";

        let touchStartX = 0;
        let touchEndX = 0;

        window.addEventListener('DOMContentLoaded', () => {
            checkLockoutState();
            initDarkMode();
            fetchListJson();
            applyFontSize();
            setupKeyboardNav();
            setupSwipeNav();
        });

        function initDarkMode() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                document.getElementById('darkModeIcon').className = "fa-solid fa-sun text-amber-400";
            } else {
                document.documentElement.classList.remove('dark');
                document.getElementById('darkModeIcon').className = "fa-solid fa-moon";
            }
        }

        function toggleDarkMode() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            document.getElementById('darkModeIcon').className = isDark ? "fa-solid fa-sun text-amber-400" : "fa-solid fa-moon";
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => console.log(err));
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }

        async function fetchListJson() {
            const select = document.getElementById('examSelect');
            try {
                const response = await fetch('./list.json');
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                examListMap = await response.json();
                
                select.innerHTML = '';
                const keys = Object.keys(examListMap);

                if (keys.length === 0) {
                    select.innerHTML = '<option value="" disabled>등록된 시험 회차가 없습니다.</option>';
                    return;
                }

                keys.forEach((key) => {
                    const opt = document.createElement('option');
                    opt.value = key;
                    opt.textContent = examListMap[key];
                    select.appendChild(opt);
                });
            } catch (error) {
                console.error('list.json 로드 실패:', error);
                select.innerHTML = '<option value="" disabled>list.json 로드 실패</option>';
                showModal("오류", "list.json 회차 목록 파일 불러오기에 실패했습니다.\n웹 서버 경로 및 파일명을 확인하세요.", [{
                    text: "확인", bg: "bg-rose-600", action: closeModal
                }]);
            }
        }

        async function startExam() {
            const select = document.getElementById('examSelect');
            selectedExamKey = select.value;

            if (!selectedExamKey) {
                showModal("알림", "응시할 시험 회차를 선택해주세요.", [{ text: "확인", bg: "bg-blue-600", action: closeModal }]);
                return;
            }

            setStartBtnLoading(true);

            try {
                const response = await fetch(`./${selectedExamKey}.json`);
                if (!response.ok) throw new Error(`해당 회차(${selectedExamKey}.json) 데이터를 찾을 수 없습니다.`);
                
                const rawData = await response.json();
                if (!Array.isArray(rawData) || rawData.length === 0) {
                    throw new Error("문제 데이터가 유효하지 않거나 비어있습니다.");
                }

                originalQuestions = rawData.map((q, idx) => ({
                    ...q,
                    id: (q.id !== undefined && q.id !== null) ? q.id : `q_${idx}`
                }));

                currentQuestions = [...originalQuestions];
                examMode = document.querySelector('input[name="examMode"]:checked').value;
                userAnswers = {};
                flaggedQuestions = {};
                isAnswerLocked = {};
                currentIndex = 0;
                timeRemaining = 3600;
                isSubmitted = false;
                omrFilter = "all";

                document.getElementById('startScreen').classList.add('hidden');
                document.getElementById('resultScreen').classList.add('hidden');
                document.getElementById('examScreen').classList.remove('hidden');
                
                document.getElementById('headerTitle').textContent = examListMap[selectedExamKey] || "승강기기능사 CBT";
                document.getElementById('totalQuestionsCount').textContent = currentQuestions.length;

                document.getElementById('omrSubmitContainer').style.display = 'block';
                document.getElementById('omrTitleHeader').innerHTML = '<i class="fa-solid fa-list-check text-blue-600 dark:text-blue-400 mr-2"></i> OMR 답안지';

                if (examMode === 'exam') {
                    document.getElementById('timerContainer').classList.remove('hidden');
                    document.getElementById('progressBarContainer').classList.remove('hidden');
                    startTimer();
                } else {
                    document.getElementById('timerContainer').classList.add('hidden');
                    document.getElementById('progressBarContainer').classList.remove('hidden');
                }

                renderOmrFilterTabs();
                renderSlides();
                renderOMR();
                updateSlidePosition();

            } catch (error) {
                console.error("문제 데이터 로드 실패:", error);
                showModal("로드 실패", error.message || "문제 파일(.json)을 로드하지 못했습니다.", [{
                    text: "확인", bg: "bg-rose-600", action: closeModal
                }]);
            } finally {
                setStartBtnLoading(false);
            }
        }

        function setStartBtnLoading(isLoading) {
            const btn = document.getElementById('btnStart');
            const btnText = document.getElementById('btnStartText');
            const btnIcon = document.getElementById('btnStartIcon');

            if (isLoading) {
                btn.disabled = true;
                btnText.textContent = "시험 불러오는 중...";
                btnIcon.className = "fa-solid fa-spinner fa-spin";
            } else {
                btn.disabled = false;
                btnText.textContent = "시험 시작하기";
                btnIcon.className = "fa-solid fa-arrow-right";
            }
        }

        function renderMathInContainer(containerElement) {
            if (window.renderMathInElement && containerElement) {
                try {
                    renderMathInElement(containerElement, {
                        delimiters: [
                            {left: '$$', right: '$$', display: true},
                            {left: '$', right: '$', display: false}
                        ],
                        throwOnError : false
                    });
                } catch (e) {
                    console.error("KaTeX rendering error:", e);
                }
            }
        }

        function renderSlides() {
            const container = document.getElementById('slideContainer');
            container.innerHTML = '';

            currentQuestions.forEach((q, idx) => {
                const item = document.createElement('div');
                item.className = "slide-item px-1";

                const userSelected = userAnswers[q.id];
                const isLocked = isAnswerLocked[q.id] || false;

                let optionsHTML = '<div class="space-y-3 my-5 exam-content-text">';
                q.options.forEach((opt, oIdx) => {
                    const optNum = oIdx + 1;
                    const isSelected = userSelected === optNum;

                    let cardStyle = "border-slate-200 dark:border-slate-700/80 bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:border-blue-400 dark:hover:border-blue-500";
                    let badgeStyle = "border-slate-300 dark:border-slate-600 text-slate-500 dark:text-slate-400";

                    if (isSelected) {
                        cardStyle = "border-blue-600 bg-blue-50/80 dark:bg-blue-900/40 text-blue-900 dark:text-blue-100 font-semibold ring-2 ring-blue-500/30";
                        badgeStyle = "border-blue-600 bg-blue-600 text-white";
                    }

                    if (isLocked && (examMode === 'practice' || examMode === 'review_all')) {
                        const isRight = q.answer === optNum;
                        if (isRight) {
                            cardStyle = "border-emerald-500 bg-emerald-50 dark:bg-emerald-950/40 text-emerald-900 dark:text-emerald-200 font-bold";
                            badgeStyle = "border-emerald-600 bg-emerald-600 text-white";
                        } else if (isSelected && !isRight) {
                            cardStyle = "border-rose-500 bg-rose-50 dark:bg-rose-950/40 text-rose-900 dark:text-rose-200 font-bold";
                            badgeStyle = "border-rose-600 bg-rose-600 text-white";
                        }
                    }

                    optionsHTML += `
                        <button onclick="selectOption('${q.id}', ${optNum})" ${isLocked && examMode !== 'practice' && examMode !== 'exam' && examMode !== 'review_all' ? 'disabled' : ''} class="w-full text-left flex items-center p-3.5 md:p-4 rounded-2xl border-2 transition-all ${cardStyle} cursor-pointer">
                            <div class="w-7 h-7 rounded-full border-2 flex items-center justify-center text-xs font-bold mr-3.5 shrink-0 transition ${badgeStyle}">
                                ${optNum}
                            </div>
                            <span class="leading-relaxed flex-1">${opt}</span>
                            <span class="text-[10px] text-slate-300 dark:text-slate-600 font-mono ml-2 hidden sm:inline">[${optNum}]</span>
                        </button>
                    `;
                });
                optionsHTML += '</div>';

                let imageHTML = '';
                if (q.image) {
                    imageHTML = `
                        <div class="my-4 max-w-md mx-auto overflow-hidden rounded-2xl border border-slate-200 dark:border-slate-700">
                            <img src="${q.image}" alt="문제 보기 이미지" class="w-full object-contain max-h-60 bg-white">
                        </div>
                    `;
                }

                let explanationHTML = '';
                if ((examMode === 'practice' || examMode === 'review_all') && isLocked) {
                    const isCorrect = userSelected === q.answer;
                    explanationHTML = `
                        <div class="mt-5 p-4 rounded-2xl border exam-content-text ${isCorrect ? 'bg-emerald-50/80 border-emerald-200 dark:bg-emerald-950/30 dark:border-emerald-800/60' : 'bg-rose-50/80 border-rose-200 dark:bg-rose-950/30 dark:border-rose-800/60'}">
                            <div class="flex items-center mb-2 font-bold ${isCorrect ? 'text-emerald-700 dark:text-emerald-400' : 'text-rose-700 dark:text-rose-400'}">
                                <i class="fa-solid ${isCorrect ? 'fa-circle-check' : 'fa-circle-xmark'} mr-2 text-lg"></i>
                                <span>${isCorrect ? '정답입니다!' : `오답입니다. (정답: ${q.answer}번)`}</span>
                            </div>
                            <div class="text-slate-700 dark:text-slate-300 leading-relaxed space-y-1">
                                <div class="font-bold border-b border-slate-200 dark:border-slate-700 pb-1 text-slate-400">정답 해설</div>
                                <div class="whitespace-pre-line pt-1">${q.explanation || '해설이 제공되지 않는 문제입니다.'}</div>
                            </div>
                        </div>
                    `;
                }

                item.innerHTML = `
                    <div id="slide-card-${q.id}" class="bg-white dark:bg-slate-800 rounded-3xl p-5 md:p-8 shadow-sm border border-slate-200 dark:border-slate-700 min-h-[380px] flex flex-col justify-between transition-colors">
                        <div class="exam-content-text">
                            <div class="text-xs font-bold text-blue-600 dark:text-blue-400 mb-1 flex justify-between items-center">
                                <span>QUESTION ${idx + 1} (원본번호: ${originalQuestions.findIndex(orig => orig.id === q.id) + 1})</span>
                                ${flaggedQuestions[q.id] ? '<span class="text-amber-500 font-bold"><i class="fa-solid fa-bookmark mr-1"></i>검토 표시됨</span>' : ''}
                            </div>
                            <h3 class="font-bold text-slate-800 dark:text-slate-100 leading-snug">
                                ${q.question}
                            </h3>
                            ${imageHTML}
                            ${optionsHTML}
                        </div>
                        ${explanationHTML}
                    </div>
                `;
                container.appendChild(item);
                
                renderMathInContainer(item);
            });
        }

        function selectOption(qId, optNum) {
            if (examMode === 'review_all') return;
            if (isAnswerLocked[qId] && examMode === 'exam') return;

            userAnswers[qId] = optNum;
            playAudioTone(600, 0.05);

            if (examMode === 'practice') {
                isAnswerLocked[qId] = true;
            }

            renderSlides();
            renderOMR();
            updateProgressBar();
        }

        function toggleFlagCurrentQuestion() {
            const currentQ = currentQuestions[currentIndex];
            if (!currentQ) return;

            flaggedQuestions[currentQ.id] = !flaggedQuestions[currentQ.id];
            playAudioTone(440, 0.08);

            updateFlagButtonUI();
            renderOMR();
            renderSlides();
        }

        function updateFlagButtonUI() {
            const currentQ = currentQuestions[currentIndex];
            if (!currentQ) return;

            const isFlagged = !!flaggedQuestions[currentQ.id];
            const btn = document.getElementById('flagBtn');
            const icon = document.getElementById('flagIcon');
            const text = document.getElementById('flagText');

            if (isFlagged) {
                btn.className = "px-2.5 py-1 rounded-lg border border-amber-300 dark:border-amber-700 bg-amber-50 dark:bg-amber-950/50 text-xs font-bold text-amber-600 dark:text-amber-400 transition flex items-center space-x-1.5";
                icon.className = "fa-solid fa-bookmark text-amber-500";
                text.textContent = "검토 해제";
            } else {
                btn.className = "px-2.5 py-1 rounded-lg border border-slate-200 dark:border-slate-700 text-xs font-bold transition flex items-center space-x-1.5 text-slate-500 hover:bg-slate-50 dark:hover:bg-slate-700";
                icon.className = "fa-regular fa-bookmark";
                text.textContent = "나중에 풀기";
            }
        }

        function updateSlidePosition() {
            const container = document.getElementById('slideContainer');
            container.style.transform = `translateX(-${currentIndex * 100}%)`;

            const currentQ = currentQuestions[currentIndex];
            document.getElementById('currentQuestionNum').textContent = currentIndex + 1;
            document.getElementById('currentCategoryBadge').textContent = currentQ ? (currentQ.category || "일반") : "일반";

            document.getElementById('btnPrevQ').disabled = (currentIndex === 0);
            const btnNext = document.getElementById('btnNextQ');
            
            if (examMode === 'review_all') {
                if (currentIndex === currentQuestions.length - 1) {
                    btnNext.innerHTML = `<span>결과로 돌아가기</span> <i class="fa-solid fa-rotate-left"></i>`;
                    btnNext.onclick = returnToResultScreen;
                } else {
                    btnNext.innerHTML = `<span>다음 문제</span> <i class="fa-solid fa-chevron-right"></i>`;
                    btnNext.onclick = nextQuestion;
                }
            } else {
                if (currentIndex === currentQuestions.length - 1) {
                    btnNext.innerHTML = `<span>제출하기</span> <i class="fa-solid fa-paper-plane"></i>`;
                    btnNext.onclick = submitExamPrompt;
                } else {
                    btnNext.innerHTML = `<span>다음 문제</span> <i class="fa-solid fa-chevron-right"></i>`;
                    btnNext.onclick = nextQuestion;
                }
            }

            updateFlagButtonUI();
            renderOMRHighlight();
            updateProgressBar();
        }

        function returnToResultScreen() {
            document.getElementById('examScreen').classList.add('hidden');
            document.getElementById('progressBarContainer').classList.add('hidden');
            document.getElementById('resultScreen').classList.remove('hidden');
        }

        function updateProgressBar() {
            const answered = Object.keys(userAnswers).filter(id => currentQuestions.some(q => q.id === id)).length;
            const total = currentQuestions.length || 60;
            const pct = Math.round((answered / total) * 100);
            document.getElementById('progressBar').style.width = `${pct}%`;
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                updateSlidePosition();
            }
        }

        function nextQuestion() {
            if (currentIndex < currentQuestions.length - 1) {
                currentIndex++;
                updateSlidePosition();
            }
        }

        function goToQuestion(index) {
            if (index >= 0 && index < currentQuestions.length) {
                currentIndex = index;
                updateSlidePosition();
                if (window.innerWidth < 1024) {
                    toggleMobileOmr(false);
                }
            }
        }

        function renderOmrFilterTabs() {
            const container = document.getElementById('omrFilterContainer');
            container.innerHTML = '';

            if (!isSubmitted) {
                container.innerHTML = `
                    <button onclick="setOmrFilter('all')" id="filterBtn-all" class="flex-1 py-1 rounded-lg ${omrFilter === 'all' ? 'bg-white dark:bg-slate-800 text-blue-600 dark:text-blue-400 shadow-xs' : 'text-slate-500 dark:text-slate-400 hover:text-slate-800'}">전체</button>
                    <button onclick="setOmrFilter('unanswered')" id="filterBtn-unanswered" class="flex-1 py-1 rounded-lg ${omrFilter === 'unanswered' ? 'bg-white dark:bg-slate-800 text-blue-600 dark:text-blue-400 shadow-xs' : 'text-slate-500 dark:text-slate-400 hover:text-slate-800'}">미풀이</button>
                    <button onclick="setOmrFilter('flagged')" id="filterBtn-flagged" class="flex-1 py-1 rounded-lg ${omrFilter === 'flagged' ? 'bg-white dark:bg-slate-800 text-blue-600 dark:text-blue-400 shadow-xs' : 'text-slate-500 dark:text-slate-400 hover:text-slate-800'}">검토★</button>
                `;
            } else {
                container.innerHTML = `
                    <button onclick="setOmrFilter('all')" id="filterBtn-all" class="flex-1 py-1 rounded-lg ${omrFilter === 'all' ? 'bg-white dark:bg-slate-800 text-blue-600 dark:text-blue-400 shadow-xs' : 'text-slate-500 dark:text-slate-400 hover:text-slate-800'}">전체</button>
                    <button onclick="setOmrFilter('flagged')" id="filterBtn-flagged" class="flex-1 py-1 rounded-lg ${omrFilter === 'flagged' ? 'bg-white dark:bg-slate-800 text-blue-600 dark:text-blue-400 shadow-xs' : 'text-slate-500 dark:text-slate-400 hover:text-slate-800'}">검토★</button>
                `;
            }
        }

        function setOmrFilter(filter) {
            omrFilter = filter;
            renderOmrFilterTabs();
            renderOMR();
        }

        function renderOMR() {
            const grid = document.getElementById('omrGrid');
            grid.innerHTML = '';

            let answeredCount = 0;

            currentQuestions.forEach((q, idx) => {
                const isAnswered = userAnswers[q.id] !== undefined;
                const isFlagged = !!flaggedQuestions[q.id];
                
                if (isAnswered) answeredCount++;

                if (!isSubmitted) {
                    if (omrFilter === 'unanswered' && isAnswered) return;
                    if (omrFilter === 'flagged' && !isFlagged) return;
                } else {
                    if (omrFilter === 'flagged' && !isFlagged) return;
                }

                const item = document.createElement('div');
                item.id = `omr-item-${idx}`;
                item.className = `flex items-center justify-between p-2 rounded-xl transition border ${
                    idx === currentIndex 
                    ? 'bg-blue-50/80 dark:bg-blue-900/30 border-blue-400 dark:border-blue-600' 
                    : 'border-transparent hover:bg-slate-50 dark:hover:bg-slate-700/50'
                }`;

                let numbersHTML = '<div class="flex space-x-1">';
                for (let i = 1; i <= 4; i++) {
                    const selected = userAnswers[q.id] === i;
                    const isLocked = isAnswerLocked[q.id] || false;

                    let btnStyle = "border-slate-300 dark:border-slate-600 text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-600";
                    if (selected) {
                        btnStyle = "bg-blue-600 border-blue-600 text-white shadow-xs font-bold";
                    }

                    if ((examMode === 'review_all' || isSubmitted) && selected) {
                        if (q.answer === i) {
                            btnStyle = "bg-emerald-600 border-emerald-600 text-white shadow-xs font-bold";
                        } else {
                            btnStyle = "bg-rose-600 border-rose-600 text-white shadow-xs font-bold";
                        }
                    }

                    numbersHTML += `
                        <button onclick="selectOption('${q.id}', ${i}); goToQuestion(${idx});" ${examMode === 'review_all' ? '' : (isLocked ? 'disabled' : '')} class="w-6 h-6 rounded-full border text-xs flex items-center justify-center transition ${btnStyle}">
                            ${i}
                        </button>
                    `;
                }
                numbersHTML += '</div>';

                const origIndex = originalQuestions.findIndex(orig => orig.id === q.id);

                item.innerHTML = `
                    <button onclick="goToQuestion(${idx})" class="text-xs font-bold ${idx === currentIndex ? 'text-blue-600 dark:text-blue-400' : 'text-slate-600 dark:text-slate-400'} w-12 text-left flex items-center">
                        ${idx + 1}. <span class="text-[10px] text-slate-400 ml-0.5">(#${origIndex + 1})</span>
                        ${isFlagged ? '<i class="fa-solid fa-star text-[9px] text-amber-500 ml-1"></i>' : ''}
                    </button>
                    ${numbersHTML}
                `;
                grid.appendChild(item);
            });

            document.getElementById('answeredCount').textContent = answeredCount;
            document.getElementById('omrTotalCount').textContent = currentQuestions.length;
        }

        function renderOMRHighlight() {
            currentQuestions.forEach((_, idx) => {
                const item = document.getElementById(`omr-item-${idx}`);
                if (item) {
                    if (idx === currentIndex) {
                        item.classList.add('bg-blue-50/80', 'dark:bg-blue-900/30', 'border-blue-400', 'dark:border-blue-600');
                        item.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                    } else {
                        item.classList.remove('bg-blue-50/80', 'dark:bg-blue-900/30', 'border-blue-400', 'dark:border-blue-600');
                    }
                }
            });
        }

        function toggleMobileOmr(forceState) {
            const drawer = document.getElementById('omrDrawer');
            if (typeof forceState === 'boolean') {
                if (forceState) drawer.classList.remove('hidden');
                else drawer.classList.add('hidden');
            } else {
                drawer.classList.toggle('hidden');
            }
        }

        function setupKeyboardNav() {
            window.addEventListener('keydown', (e) => {
                if (pinOverlay.style.display !== 'none') return;

                const examScreen = document.getElementById('examScreen');
                if (examScreen.classList.contains('hidden')) return;

                if (e.key === 'ArrowLeft') prevQuestion();
                if (e.key === 'ArrowRight') nextQuestion();
                if (e.key.toLowerCase() === 'f') toggleFlagCurrentQuestion();
                if (['1', '2', '3', '4'].includes(e.key)) {
                    const currentQ = currentQuestions[currentIndex];
                    if (currentQ) selectOption(currentQ.id, parseInt(e.key));
                }
            });
        }

        function setupSwipeNav() {
            const container = document.getElementById('slideContainer');
            container.addEventListener('touchstart', (e) => {
                if (pinOverlay.style.display !== 'none') return;
                touchStartX = e.changedTouches[0].screenX;
            }, { passive: true });

            container.addEventListener('touchend', (e) => {
                if (pinOverlay.style.display !== 'none') return;
                touchEndX = e.changedTouches[0].screenX;
                const diff = touchStartX - touchEndX;
                if (Math.abs(diff) > 50) {
                    if (diff > 0) nextQuestion();
                    else prevQuestion();
                }
            }, { passive: true });
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            const timerEl = document.getElementById('timer');

            timerInterval = setInterval(() => {
                if (timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    playAudioTone(300, 0.5);
                    showModal("시간 종료", "시험 시간이 종료되어 자동으로 답안이 제출됩니다.", [{
                        text: "확인", bg: "bg-blue-600", action: () => { closeModal(); processSubmitExam(); }
                    }]);
                    return;
                }

                timeRemaining--;
                const min = Math.floor(timeRemaining / 60);
                const sec = timeRemaining % 60;
                timerEl.textContent = `${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;

                if (timeRemaining === 300) {
                    playAudioTone(440, 0.3);
                }
            }, 1000);
        }

        function submitExamPrompt() {
            const answeredCount = Object.keys(userAnswers).filter(id => currentQuestions.some(q => q.id === id)).length;
            const totalCount = currentQuestions.length;
            const unanswered = totalCount - answeredCount;

            let msg = `총 ${totalCount}문항 중 ${answeredCount}문항에 답하였습니다.`;
            if (unanswered > 0) {
                msg += `\n(미답항 ${unanswered}문항은 오답 처리됩니다.)`;
            }
            msg += `\n\n답안을 최종 제출하시겠습니까?`;

            showModal("최종 제출", msg, [
                { text: "계속 풀기", bg: "bg-slate-500", action: closeModal },
                { text: "제출하기", bg: "bg-emerald-600", action: () => { closeModal(); processSubmitExam(); } }
            ]);
        }

        function processSubmitExam() {
            if (timerInterval) clearInterval(timerInterval);
            isSubmitted = true;

            let correctCount = 0;
            let subjectScores = {};

            currentQuestions.forEach(q => {
                const category = q.category || "일반";
                if (!subjectScores[category]) {
                    subjectScores[category] = { total: 0, correct: 0 };
                }
                subjectScores[category].total++;

                const userAns = userAnswers[q.id];
                if (userAns === q.answer) {
                    correctCount++;
                    subjectScores[category].correct++;
                }
            });

            const totalQ = currentQuestions.length;
            const score = Math.round((correctCount / totalQ) * 100);
            const isPass = score >= 60;

            document.getElementById('examScreen').classList.add('hidden');
            document.getElementById('timerContainer').classList.add('hidden');
            document.getElementById('progressBarContainer').classList.add('hidden');
            document.getElementById('resultScreen').classList.remove('hidden');

            const passBadge = document.getElementById('passBadge');
            if (isPass) {
                passBadge.className = "inline-block px-4 py-1.5 rounded-full text-xs font-extrabold mb-3 bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300";
                passBadge.innerHTML = `<i class="fa-solid fa-award mr-1"></i> 합격 (60점 이상)`;
            } else {
                passBadge.className = "inline-block px-4 py-1.5 rounded-full text-xs font-extrabold mb-3 bg-rose-100 text-rose-800 dark:bg-rose-950 dark:text-rose-300";
                passBadge.innerHTML = `<i class="fa-solid fa-triangle-exclamation mr-1"></i> 불합격 (60점 미만)`;
            }

            document.getElementById('scoreDisplay').textContent = score;
            document.getElementById('scoreSubText').textContent = `총 ${totalQ}문항 중 ${correctCount}문항 정답 (${score}점)`;

            const subjectListEl = document.getElementById('subjectScoreList');
            subjectListEl.innerHTML = '';

            Object.keys(subjectScores).forEach(cat => {
                const data = subjectScores[cat];
                const catScore = Math.round((data.correct / data.total) * 100);
                const card = document.createElement('div');
                card.className = "bg-slate-50 dark:bg-slate-900/60 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 space-y-2";
                card.innerHTML = `
                    <div class="font-bold text-xs text-slate-700 dark:text-slate-300 truncate">${cat}</div>
                    <div class="flex justify-between items-baseline font-mono">
                        <span class="text-lg font-black text-blue-600 dark:text-blue-400">${catScore}점</span>
                        <span class="text-xs text-slate-400">${data.correct}/${data.total} 정답</span>
                    </div>
                `;
                subjectListEl.appendChild(card);
            });

            playAudioTone(isPass ? 750 : 300, 0.4);
        }

        function reviewAllAnswers() {
            examMode = 'review_all';
            currentIndex = 0;
            isSubmitted = true;
            
            currentQuestions.forEach(q => {
                isAnswerLocked[q.id] = true;
            });

            document.getElementById('resultScreen').classList.add('hidden');
            document.getElementById('examScreen').classList.remove('hidden');
            document.getElementById('progressBarContainer').classList.remove('hidden');

            renderOmrFilterTabs();
            renderSlides();
            renderOMR();
            updateSlidePosition();
        }

        function resetToStart() {
            if (timerInterval) clearInterval(timerInterval);
            document.getElementById('examScreen').classList.add('hidden');
            document.getElementById('resultScreen').classList.add('hidden');
            document.getElementById('timerContainer').classList.add('hidden');
            document.getElementById('progressBarContainer').classList.add('hidden');
            document.getElementById('startScreen').classList.remove('hidden');
            document.getElementById('headerTitle').textContent = "승강기기능사 CBT";
        }

        function changeFontSize(direction) {
            fontSizeLevel = Math.max(0, Math.min(fontSizeClasses.length - 1, fontSizeLevel + direction));
            applyFontSize();
        }

        function resetFontSize() {
            fontSizeLevel = 1;
            applyFontSize();
        }

        function applyFontSize() {
            document.body.className = document.body.className.replace(/cbt-text-(sm|base|lg|xl)/g, '');
            document.body.classList.add(fontSizeClasses[fontSizeLevel]);
        }

        function showModal(title, message, buttonsConfig) {
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalMessage').textContent = message;
            
            const btnContainer = document.getElementById('modalButtons');
            btnContainer.innerHTML = '';

            buttonsConfig.forEach(cfg => {
                const btn = document.createElement('button');
                btn.className = `px-4 py-2 rounded-xl text-xs font-bold text-white shadow transition ${cfg.bg || 'bg-blue-600'}`;
                btn.textContent = cfg.text;
                btn.onclick = cfg.action;
                btnContainer.appendChild(btn);
            });

            document.getElementById('modalBackdrop').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modalBackdrop').classList.add('hidden');
        }
    </script>
</body>
</html>
