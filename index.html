<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>승강기기능사 CBT 시험장</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- KaTeX for Math Rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; }
        
        /* Font size adjustment classes */
        .text-size-sm { font-size: 0.875rem; }
        .text-size-base { font-size: 1rem; }
        .text-size-lg { font-size: 1.125rem; }
        .text-size-xl { font-size: 1.25rem; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .dark ::-webkit-scrollbar-track { background: #1e293b; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }

        .katex-display { margin: 0.5em 0 !important; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 dark:bg-slate-900 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-200">

    <!-- Header / Navbar -->
    <header class="bg-slate-800 text-white shadow-md sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="resetToStart()">
                <i class="fa-solid font-bold text-xl text-blue-400 fa-elevator"></i>
                <h1 class="font-bold text-lg md:text-xl tracking-tight" id="headerTitle">승강기기능사 CBT 모의고사</h1>
            </div>
            
            <div class="flex items-center space-x-2 md:space-x-4">
                <!-- Font size controls -->
                <div class="hidden sm:flex items-center bg-slate-700 rounded-lg p-1 space-x-1 text-xs">
                    <button onclick="changeFontSize(-1)" class="px-2 py-1 rounded hover:bg-slate-600 transition" title="글자 축소">A-</button>
                    <button onclick="resetFontSize()" class="px-2 py-1 rounded hover:bg-slate-600 transition" title="기본 크기">A</button>
                    <button onclick="changeFontSize(1)" class="px-2 py-1 rounded hover:bg-slate-600 transition" title="글자 확대">A+</button>
                </div>

                <!-- Dark Mode Toggle -->
                <button onclick="toggleDarkMode()" class="p-2 rounded-lg bg-slate-700 hover:bg-slate-600 text-amber-300 transition" title="다크모드 전환">
                    <i id="darkModeIcon" class="fa-solid fa-moon"></i>
                </button>

                <!-- Timer -->
                <div id="timerContainer" class="hidden flex items-center bg-red-600 text-white px-3 py-1 rounded-lg font-mono font-bold text-sm md:text-base animate-pulse">
                    <i class="fa-regular fa-clock mr-2"></i><span id="timer">60:00</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-3 sm:p-4 md:p-6">
        
        <!-- START SCREEN / CONFIGURATION -->
        <div id="startScreen" class="max-w-2xl mx-auto bg-white dark:bg-slate-800 rounded-2xl shadow-xl p-6 md:p-8 mt-4 border border-slate-200 dark:border-slate-700">
            <div class="text-center mb-6">
                <span class="bg-blue-100 text-blue-800 dark:bg-blue-900/50 dark:text-blue-300 text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider">CBT Test System</span>
                <h2 class="text-2xl md:text-3xl font-extrabold mt-2 text-slate-900 dark:text-white">승강기기능사 기출문제 풀이</h2>
                <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">원하는 회차와 모드를 선택하여 시험을 시작하세요.</p>
            </div>

            <!-- Exam Selector -->
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold mb-2 text-slate-700 dark:text-slate-300">시험 회차 선택</label>
                    <div class="relative">
                        <select id="examSelect" class="w-full p-3 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-700 text-slate-800 dark:text-slate-100 focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
                            <option value="" disabled selected>목록을 불러오는 중...</option>
                        </select>
                        <div id="selectLoading" class="hidden absolute right-3 top-3 text-blue-500">
                            <i class="fa-solid fa-circle-notch fa-spin"></i>
                        </div>
                    </div>
                </div>

                <!-- Mode Selection -->
                <div>
                    <label class="block text-sm font-semibold mb-2 text-slate-700 dark:text-slate-300">응시 모드 선택</label>
                    <div class="grid grid-cols-2 gap-3">
                        <label class="border-2 border-slate-200 dark:border-slate-700 rounded-xl p-4 cursor-pointer hover:border-blue-500 dark:hover:border-blue-500 transition flex flex-col items-center text-center has-[:checked]:border-blue-600 has-[:checked]:bg-blue-50 dark:has-[:checked]:bg-blue-900/20">
                            <input type="radio" name="examMode" value="exam" checked class="hidden">
                            <i class="fa-solid fa-stopwatch text-2xl text-blue-600 dark:text-blue-400 mb-2"></i>
                            <span class="font-bold text-sm">실전 모의고사</span>
                            <span class="text-xs text-slate-500 dark:text-slate-400 mt-1">제한시간 60분<br>제출 후 성적/해설 확인</span>
                        </label>
                        <label class="border-2 border-slate-200 dark:border-slate-700 rounded-xl p-4 cursor-pointer hover:border-blue-500 dark:hover:border-blue-500 transition flex flex-col items-center text-center has-[:checked]:border-blue-600 has-[:checked]:bg-blue-50 dark:has-[:checked]:bg-blue-900/20">
                            <input type="radio" name="examMode" value="practice" class="hidden">
                            <i class="fa-solid fa-book-open text-2xl text-emerald-600 dark:text-emerald-400 mb-2"></i>
                            <span class="font-bold text-sm">연습 모드</span>
                            <span class="text-xs text-slate-500 dark:text-slate-400 mt-1">시간 제한 없음<br>문제 풀이 즉시 정답 확인</span>
                        </label>
                    </div>
                </div>

                <!-- Start Button -->
                <button id="btnStart" onclick="startExam()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl shadow-lg hover:shadow-xl transition duration-200 text-base flex items-center justify-center space-x-2">
                    <span id="btnStartText">시험 시작하기</span>
                    <i id="btnStartIcon" class="fa-solid fa-arrow-right"></i>
                </button>
            </div>
        </div>

        <!-- EXAM SCREEN -->
        <div id="examScreen" class="hidden grid grid-cols-1 lg:grid-cols-4 gap-6">
            <!-- Left 3 Columns: Question Paper -->
            <div class="lg:col-span-3 space-y-4">
                <div class="bg-white dark:bg-slate-800 p-3 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 flex flex-wrap justify-between items-center gap-2">
                    <div id="categoryTabs" class="flex flex-wrap gap-1.5"></div>
                    <div class="text-xs font-semibold text-slate-500 dark:text-slate-400">
                        총 <span id="totalQuestionsCount" class="text-blue-600 dark:text-blue-400 font-bold">0</span>문제
                    </div>
                </div>

                <div id="questionsContainer" class="space-y-6"></div>

                <div class="bg-white dark:bg-slate-800 p-4 rounded-xl shadow-md border border-slate-200 dark:border-slate-700 flex justify-between items-center sticky bottom-3 z-20">
                    <button onclick="scrollToQuestion('prev')" class="bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 font-semibold px-4 py-2 rounded-lg text-sm transition">
                        <i class="fa-solid fa-chevron-left mr-1"></i> 이전
                    </button>
                    
                    <button onclick="submitExamPrompt()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-6 py-2.5 rounded-lg shadow-md text-sm transition flex items-center">
                        <i class="fa-solid fa-paper-plane mr-2"></i> 답안 제출하기
                    </button>

                    <button onclick="scrollToQuestion('next')" class="bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 font-semibold px-4 py-2 rounded-lg text-sm transition">
                        다음 <i class="fa-solid fa-chevron-right ml-1"></i>
                    </button>
                </div>
            </div>

            <!-- Right 1 Column: OMR Card Panel -->
            <div class="lg:col-span-1">
                <div class="bg-white dark:bg-slate-800 rounded-xl shadow-md border border-slate-200 dark:border-slate-700 p-4 sticky top-20 max-h-[calc(100vh-6rem)] flex flex-col">
                    <div class="flex justify-between items-center pb-3 border-b border-slate-200 dark:border-slate-700 mb-3">
                        <h3 class="font-bold text-base flex items-center">
                            <i class="fa-solid fa-list-check text-blue-600 dark:text-blue-400 mr-2"></i> OMR 답안지
                        </h3>
                        <span class="text-xs bg-slate-100 dark:bg-slate-700 px-2 py-1 rounded text-slate-600 dark:text-slate-300 font-medium">
                            <span id="answeredCount" class="text-blue-600 dark:text-blue-400 font-bold">0</span> / <span id="omrTotalCount">0</span>
                        </span>
                    </div>

                    <div id="omrGrid" class="flex-1 overflow-y-auto space-y-1.5 pr-1"></div>
                </div>
            </div>
        </div>

        <!-- RESULT SCREEN -->
        <div id="resultScreen" class="hidden max-w-4xl mx-auto bg-white dark:bg-slate-800 rounded-2xl shadow-xl p-6 md:p-8 border border-slate-200 dark:border-slate-700 my-4">
            <div class="text-center pb-6 border-b border-slate-200 dark:border-slate-700 mb-6">
                <div id="passBadge" class="inline-block px-4 py-1.5 rounded-full text-sm font-bold mb-3"></div>
                <h2 class="text-3xl font-extrabold text-slate-900 dark:text-white">최종 채점 결과</h2>
                <div class="flex justify-center items-baseline space-x-2 mt-4">
                    <span id="scoreDisplay" class="text-5xl font-black text-blue-600 dark:text-blue-400">0</span>
                    <span class="text-xl text-slate-500 font-bold">/ 100점</span>
                </div>
                <p id="scoreSubText" class="text-sm text-slate-500 dark:text-slate-400 mt-2"></p>
            </div>

            <div class="mb-8">
                <h3 class="font-bold text-lg mb-3 flex items-center">
                    <i class="fa-solid fa-chart-pie text-blue-500 mr-2"></i> 과목별 성적 분석
                </h3>
                <div id="subjectScoreList" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
            </div>

            <div class="flex flex-col sm:flex-row justify-center gap-3">
                <button onclick="reviewWrongAnswersOnly()" class="bg-amber-500 hover:bg-amber-600 text-white font-bold px-6 py-3 rounded-xl shadow transition text-sm flex items-center justify-center">
                    <i class="fa-solid fa-xmark mr-2"></i> 틀린 문제만 오답노트 보기
                </button>
                <button onclick="reviewAllAnswers()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-6 py-3 rounded-xl shadow transition text-sm flex items-center justify-center">
                    <i class="fa-solid fa-check-double mr-2"></i> 전체 해설 다시보기
                </button>
                <button onclick="resetToStart()" class="bg-slate-600 hover:bg-slate-700 text-white font-bold px-6 py-3 rounded-xl shadow transition text-sm flex items-center justify-center">
                    <i class="fa-solid fa-rotate-left mr-2"></i> 다른 시험 풀기
                </button>
            </div>
        </div>

    </main>

    <!-- Modal Dialogs -->
    <div id="modalBackdrop" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-200 dark:border-slate-700">
            <h3 id="modalTitle" class="text-xl font-bold mb-2">알림</h3>
            <p id="modalMessage" class="text-slate-600 dark:text-slate-300 text-sm mb-6 whitespace-pre-line"></p>
            <div id="modalButtons" class="flex justify-end space-x-3"></div>
        </div>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        let examListMap = {}; // list.json 내용 저장
        let currentQuestions = [];
        let userAnswers = {};
        let examMode = "exam";
        let selectedCategory = "전체";
        let timerInterval = null;
        let timeRemaining = 3600;
        let fontSizeLevel = 1;
        const fontSizeClasses = ['text-size-sm', 'text-size-base', 'text-size-lg', 'text-size-xl'];

        window.addEventListener('DOMContentLoaded', () => {
            fetchListJson();
            applyFontSize();
        });

        // 1. list.json 동적로드
        async function fetchListJson() {
            const select = document.getElementById('examSelect');
            try {
                const response = await fetch('./list.json');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                examListMap = await response.json();
                
                select.innerHTML = '';
                const keys = Object.keys(examListMap);

                if (keys.length === 0) {
                    select.innerHTML = '<option value="" disabled>등록된 시험이 없습니다.</option>';
                    return;
                }

                keys.forEach((key) => {
                    const opt = document.createElement('option');
                    opt.value = key;
                    opt.textContent = examListMap[key];
                    select.appendChild(opt);
                });
            } catch (error) {
                console.error('list.json 로드 실패:', error);
                select.innerHTML = '<option value="" disabled>list.json 불러오기 실패</option>';
                showModal("오류", "list.json 파일 불러오기에 실패했습니다.\n파일 경로 및 웹 서버(GitHub Pages) 상태를 확인해주세요.", [{
                    text: "확인", bg: "bg-red-600", action: closeModal
                }]);
            }
        }

        // 2. 선택된 회차 JSON 파일 (${selectedKey}.json) 동적 로드 및 시험 시작
        async function startExam() {
            const select = document.getElementById('examSelect');
            const selectedKey = select.value;

            if (!selectedKey) {
                showModal("알림", "시험 회차를 선택해주세요.", [{
                    text: "확인", bg: "bg-blue-600", action: closeModal
                }]);
                return;
            }

            // 로딩 상태 시작
            setStartBtnLoading(true);

            try {
                const response = await fetch(`./${selectedKey}.json`);
                if (!response.ok) {
                    throw new Error(`해당 회차(${selectedKey}.json) 파일을 찾을 수 없습니다.`);
                }
                currentQuestions = await response.json();

                if (!Array.isArray(currentQuestions) || currentQuestions.length === 0) {
                    throw new Error("문제 데이터가 비어있거나 올바른 형식이 아닙니다.");
                }

                examMode = document.querySelector('input[name="examMode"]:checked').value;
                userAnswers = {};
                selectedCategory = "전체";
                timeRemaining = 3600;

                // UI 화면 전환
                document.getElementById('startScreen').classList.add('hidden');
                document.getElementById('resultScreen').classList.add('hidden');
                document.getElementById('examScreen').classList.remove('hidden');
                
                document.getElementById('headerTitle').textContent = examListMap[selectedKey] || "승강기기능사 CBT";

                if (examMode === 'exam') {
                    document.getElementById('timerContainer').classList.remove('hidden');
                    startTimer();
                } else {
                    document.getElementById('timerContainer').classList.add('hidden');
                }

                renderCategoryTabs();
                renderQuestions();
                renderOMR();
                setTimeout(renderMath, 100);

            } catch (error) {
                console.error("문제 로드 실패:", error);
                showModal("문제 로드 실패", error.message || "문제 파일(.json)을 불러오지 못했습니다.", [{
                    text: "확인", bg: "bg-red-600", action: closeModal
                }]);
            } finally {
                setStartBtnLoading(false);
            }
        }

        function setStartBtnLoading(isLoading) {
            const btn = document.getElementById('btnStart');
            const btnText = document.getElementById('btnStartText');
            const btnIcon = document.getElementById('btnStartIcon');

            if (isLoading) {
                btn.disabled = true;
                btnText.textContent = "문제 로딩 중...";
                btnIcon.className = "fa-solid fa-spinner fa-spin";
            } else {
                btn.disabled = false;
                btnText.textContent = "시험 시작하기";
                btnIcon.className = "fa-solid fa-arrow-right";
            }
        }

        // 타이머 기능
        function startTimer() {
            clearInterval(timerInterval);
            updateTimerDisplay();
            timerInterval = setInterval(() => {
                timeRemaining--;
                updateTimerDisplay();
                if (timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    showModal("시간 종료", "시험 시간이 종료되어 답안이 자동 제출됩니다.", [{
                        text: "결과 확인", bg: "bg-red-600", action: () => { closeModal(); submitExam(); }
                    }]);
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const minutes = Math.floor(timeRemaining / 60);
            const seconds = timeRemaining % 60;
            document.getElementById('timer').textContent = 
                `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        // 카테고리 탭 렌더링
        function renderCategoryTabs() {
            const categories = ["전체", ...new Set(currentQuestions.map(q => q.category).filter(Boolean))];
            const container = document.getElementById('categoryTabs');
            container.innerHTML = '';

            categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = `px-3 py-1.5 rounded-lg text-xs font-semibold transition ${
                    selectedCategory === cat 
                    ? 'bg-blue-600 text-white shadow' 
                    : 'bg-slate-100 text-slate-600 dark:bg-slate-700 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-600'
                }`;
                btn.textContent = cat;
                btn.onclick = () => {
                    selectedCategory = cat;
                    renderCategoryTabs();
                    renderQuestions();
                };
                container.appendChild(btn);
            });

            document.getElementById('totalQuestionsCount').textContent = currentQuestions.length;
        }

        // 문제 렌더링
        function renderQuestions() {
            const container = document.getElementById('questionsContainer');
            container.innerHTML = '';

            const filteredQuestions = selectedCategory === "전체" 
                ? currentQuestions 
                : currentQuestions.filter(q => q.category === selectedCategory);

            filteredQuestions.forEach((q) => {
                const qCard = document.createElement('div');
                qCard.id = `question-${q.id}`;
                qCard.className = "bg-white dark:bg-slate-800 rounded-2xl p-5 md:p-6 shadow-md border border-slate-200 dark:border-slate-700 transition duration-200";

                const catBadge = q.category ? `<span class="bg-blue-50 text-blue-700 dark:bg-blue-900/40 dark:text-blue-300 text-xs px-2.5 py-1 rounded-md font-bold mr-2">${q.category}</span>` : '';
                
                let questionHTML = `
                    <div class="flex items-start justify-between mb-4">
                        <div class="flex items-start space-x-2">
                            <span class="font-extrabold text-blue-600 dark:text-blue-400 text-lg md:text-xl">Q${q.id}.</span>
                            <div class="font-bold text-slate-800 dark:text-slate-100 text-base md:text-lg leading-snug">
                                ${catBadge}${q.question}
                            </div>
                        </div>
                    </div>
                `;

                let optionsHTML = '<div class="space-y-2.5 my-4">';
                q.options.forEach((opt, idx) => {
                    const optNum = idx + 1;
                    const isChecked = userAnswers[q.id] === optNum;
                    
                    let extraStyles = "border-slate-200 dark:border-slate-700 hover:border-blue-300 dark:hover:border-blue-600";
                    if (isChecked) {
                        extraStyles = "border-blue-600 bg-blue-50/70 dark:bg-blue-900/30 font-semibold ring-2 ring-blue-500/30";
                    }

                    optionsHTML += `
                        <label onclick="selectOption(${q.id}, ${optNum})" class="flex items-center p-3.5 rounded-xl border-2 cursor-pointer transition ${extraStyles}">
                            <div class="w-6 h-6 rounded-full border-2 flex items-center justify-center text-xs font-bold mr-3 transition ${
                                isChecked ? 'border-blue-600 bg-blue-600 text-white' : 'border-slate-300 text-slate-500 dark:border-slate-600'
                            }">
                                ${optNum}
                            </div>
                            <span class="text-slate-700 dark:text-slate-200 text-sm md:text-base flex-1">${opt}</span>
                        </label>
                    `;
                });
                optionsHTML += '</div>';

                let explanationHTML = '';
                if (examMode === 'practice' && userAnswers[q.id]) {
                    const isCorrect = userAnswers[q.id] === q.answer;
                    explanationHTML = `
                        <div class="mt-4 p-4 rounded-xl border ${isCorrect ? 'bg-emerald-50 border-emerald-200 dark:bg-emerald-950/40 dark:border-emerald-800' : 'bg-red-50 border-red-200 dark:bg-red-950/40 dark:border-red-800'}">
                            <div class="flex items-center mb-2 font-bold ${isCorrect ? 'text-emerald-700 dark:text-emerald-400' : 'text-red-700 dark:text-red-400'}">
                                <i class="fa-solid ${isCorrect ? 'fa-circle-check' : 'fa-circle-xmark'} mr-2 text-lg"></i>
                                <span>${isCorrect ? '정답입니다!' : `오답입니다. (정답: ${q.answer}번)`}</span>
                            </div>
                            <div class="text-xs sm:text-sm text-slate-700 dark:text-slate-300 leading-relaxed space-y-2">
                                <div class="font-bold border-b border-slate-200 dark:border-slate-700 pb-1">해설</div>
                                <div class="whitespace-pre-line">${q.explanation || '해설이 없습니다.'}</div>
                            </div>
                        </div>
                    `;
                }

                qCard.innerHTML = questionHTML + optionsHTML + explanationHTML;
                container.appendChild(qCard);
            });

            renderMath();
        }

        function selectOption(qId, optNum) {
            userAnswers[qId] = optNum;
            renderQuestions();
            renderOMR();
        }

        // OMR 답안지 렌더링
        function renderOMR() {
            const grid = document.getElementById('omrGrid');
            grid.innerHTML = '';

            let answeredCount = 0;

            currentQuestions.forEach((q) => {
                const isAnswered = userAnswers[q.id] !== undefined;
                if (isAnswered) answeredCount++;

                const item = document.createElement('div');
                item.className = "flex items-center justify-between p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700/50 transition border border-transparent";
                
                let numbersHTML = '<div class="flex space-x-1">';
                for (let i = 1; i <= 4; i++) {
                    const selected = userAnswers[q.id] === i;
                    numbersHTML += `
                        <button onclick="selectOption(${q.id}, ${i}); scrollToQuestionDirect(${q.id})" class="w-6 h-6 rounded-full border text-xs font-bold flex items-center justify-center transition ${
                            selected 
                            ? 'bg-blue-600 border-blue-600 text-white shadow-sm' 
                            : 'border-slate-300 dark:border-slate-600 text-slate-500 hover:bg-slate-200 dark:hover:bg-slate-600'
                        }">
                            ${i}
                        </button>
                    `;
                }
                numbersHTML += '</div>';

                item.innerHTML = `
                    <button onclick="scrollToQuestionDirect(${q.id})" class="text-xs font-bold text-slate-600 dark:text-slate-400 hover:text-blue-600 w-8 text-left">
                        ${q.id}.
                    </button>
                    ${numbersHTML}
                `;
                grid.appendChild(item);
            });

            document.getElementById('answeredCount').textContent = answeredCount;
            document.getElementById('omrTotalCount').textContent = currentQuestions.length;
        }

        function scrollToQuestionDirect(qId) {
            const el = document.getElementById(`question-${qId}`);
            if (el) {
                el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        function scrollToQuestion(direction) {
            window.scrollBy({ top: direction === 'next' ? 300 : -300, behavior: 'smooth' });
        }

        function submitExamPrompt() {
            const unanswered = currentQuestions.length - Object.keys(userAnswers).length;
            let msg = `총 ${currentQuestions.length}문제 중 ${Object.keys(userAnswers).length}문제를 작성하셨습니다.`;
            if (unanswered > 0) {
                msg += `\n(풀지 않은 문제: ${unanswered}개)`;
            }
            msg += "\n\n정말로 최종 답안을 제출하시겠습니까?";

            showModal("답안 제출 확인", msg, [
                { text: "취소", bg: "bg-slate-400", action: closeModal },
                { text: "제출하기", bg: "bg-emerald-600", action: () => { closeModal(); submitExam(); } }
            ]);
        }

        // 시험 제출 및 채점
        function submitExam() {
            clearInterval(timerInterval);

            let correctCount = 0;
            const categoryStats = {};

            currentQuestions.forEach(q => {
                const userAns = userAnswers[q.id];
                const isCorrect = userAns === q.answer;

                if (isCorrect) correctCount++;

                const cat = q.category || '일반';
                if (!categoryStats[cat]) {
                    categoryStats[cat] = { total: 0, correct: 0 };
                }
                categoryStats[cat].total++;
                if (isCorrect) categoryStats[cat].correct++;
            });

            const score = Math.round((correctCount / currentQuestions.length) * 100);
            const isPass = score >= 60;

            document.getElementById('examScreen').classList.add('hidden');
            document.getElementById('resultScreen').classList.remove('hidden');

            const passBadge = document.getElementById('passBadge');
            if (isPass) {
                passBadge.className = "inline-block px-4 py-1.5 rounded-full text-sm font-bold mb-3 bg-emerald-100 text-emerald-800 dark:bg-emerald-900/60 dark:text-emerald-300";
                passBadge.innerHTML = '<i class="fa-solid fa-trophy mr-1"></i> 합격 (60점 이상)';
            } else {
                passBadge.className = "inline-block px-4 py-1.5 rounded-full text-sm font-bold mb-3 bg-red-100 text-red-800 dark:bg-red-900/60 dark:text-red-300";
                passBadge.innerHTML = '<i class="fa-solid fa-triangle-exclamation mr-1"></i> 불합격 (60점 미만)';
            }

            document.getElementById('scoreDisplay').textContent = score;
            document.getElementById('scoreSubText').textContent = `맞힌 문제: ${correctCount} / ${currentQuestions.length}개`;

            const subjectContainer = document.getElementById('subjectScoreList');
            subjectContainer.innerHTML = '';

            for (const [cat, stat] of Object.entries(categoryStats)) {
                const catScore = Math.round((stat.correct / stat.total) * 100);
                const card = document.createElement('div');
                card.className = "bg-slate-50 dark:bg-slate-700/50 p-4 rounded-xl border border-slate-200 dark:border-slate-600";
                card.innerHTML = `
                    <div class="text-xs font-semibold text-slate-500 dark:text-slate-400">${cat}</div>
                    <div class="flex justify-between items-baseline mt-1">
                        <span class="text-lg font-bold">${stat.correct} / ${stat.total}</span>
                        <span class="text-sm font-extrabold ${catScore >= 60 ? 'text-emerald-600 dark:text-emerald-400' : 'text-red-500'}">${catScore}점</span>
                    </div>
                    <div class="w-full bg-slate-200 dark:bg-slate-600 h-2 rounded-full mt-2 overflow-hidden">
                        <div class="h-full ${catScore >= 60 ? 'bg-emerald-500' : 'bg-red-500'}" style="width: ${catScore}%"></div>
                    </div>
                `;
                subjectContainer.appendChild(card);
            }
        }

        function reviewWrongAnswersOnly() {
            document.getElementById('resultScreen').classList.add('hidden');
            document.getElementById('examScreen').classList.remove('hidden');
            renderReviewScreen(true);
        }

        function reviewAllAnswers() {
            document.getElementById('resultScreen').classList.add('hidden');
            document.getElementById('examScreen').classList.remove('hidden');
            renderReviewScreen(false);
        }

        function renderReviewScreen(wrongOnly = false) {
            const container = document.getElementById('questionsContainer');
            container.innerHTML = '';

            const questionsToDisplay = wrongOnly 
                ? currentQuestions.filter(q => userAnswers[q.id] !== q.answer)
                : currentQuestions;

            if (questionsToDisplay.length === 0 && wrongOnly) {
                container.innerHTML = '<div class="text-center py-12 text-slate-500 font-bold">틀린 문제가 없습니다! 축하합니다 🎉</div>';
                return;
            }

            questionsToDisplay.forEach(q => {
                const userAns = userAnswers[q.id];
                const isCorrect = userAns === q.answer;

                const qCard = document.createElement('div');
                qCard.id = `question-${q.id}`;
                qCard.className = `bg-white dark:bg-slate-800 rounded-2xl p-5 md:p-6 shadow-md border-2 ${
                    isCorrect ? 'border-emerald-500/40' : 'border-red-500/40'
                }`;

                let optionsHTML = '<div class="space-y-2.5 my-4">';
                q.options.forEach((opt, idx) => {
                    const optNum = idx + 1;
                    const isUserChoice = userAns === optNum;
                    const isRightAnswer = q.answer === optNum;

                    let optionBorder = "border-slate-200 dark:border-slate-700";
                    let optionBadge = `<div class="w-6 h-6 rounded-full border flex items-center justify-center text-xs font-bold mr-3">${optNum}</div>`;

                    if (isRightAnswer) {
                        optionBorder = "border-emerald-500 bg-emerald-50 dark:bg-emerald-950/40 font-bold text-emerald-800 dark:text-emerald-300";
                        optionBadge = `<div class="w-6 h-6 rounded-full bg-emerald-600 text-white flex items-center justify-center text-xs font-bold mr-3"><i class="fa-solid fa-check"></i></div>`;
                    } else if (isUserChoice && !isCorrect) {
                        optionBorder = "border-red-500 bg-red-50 dark:bg-red-950/40 font-bold text-red-800 dark:text-red-300";
                        optionBadge = `<div class="w-6 h-6 rounded-full bg-red-600 text-white flex items-center justify-center text-xs font-bold mr-3"><i class="fa-solid fa-xmark"></i></div>`;
                    }

                    optionsHTML += `
                        <div class="flex items-center p-3.5 rounded-xl border-2 ${optionBorder}">
                            ${optionBadge}
                            <span class="text-sm md:text-base flex-1">${opt}</span>
                            ${isRightAnswer ? '<span class="text-xs bg-emerald-600 text-white px-2 py-0.5 rounded font-bold ml-2">정답</span>' : ''}
                            ${isUserChoice && !isCorrect ? '<span class="text-xs bg-red-600 text-white px-2 py-0.5 rounded font-bold ml-2">내가 푼 답</span>' : ''}
                        </div>
                    `;
                });
                optionsHTML += '</div>';

                const explanationHTML = `
                    <div class="mt-4 p-4 rounded-xl bg-slate-50 dark:bg-slate-700/50 border border-slate-200 dark:border-slate-600">
                        <div class="font-bold text-sm mb-2 text-blue-600 dark:text-blue-400 flex items-center">
                            <i class="fa-solid fa-lightbulb mr-2"></i> 정답 및 상세 해설
                        </div>
                        <div class="text-xs sm:text-sm text-slate-700 dark:text-slate-300 whitespace-pre-line leading-relaxed">
                            ${q.explanation || '해설이 제공되지 않는 문제입니다.'}
                        </div>
                    </div>
                `;

                qCard.innerHTML = `
                    <div class="flex items-start justify-between mb-2">
                        <span class="bg-slate-100 text-slate-700 dark:bg-slate-700 dark:text-slate-300 text-xs px-2.5 py-1 rounded-md font-bold">${q.category}</span>
                        <span class="text-xs font-bold px-2.5 py-1 rounded-full ${isCorrect ? 'bg-emerald-100 text-emerald-800' : 'bg-red-100 text-red-800'}">
                            ${isCorrect ? '정답' : '오답'}
                        </span>
                    </div>
                    <div class="font-bold text-slate-800 dark:text-slate-100 text-base md:text-lg mb-4">
                        <span class="text-blue-600 mr-1">Q${q.id}.</span> ${q.question}
                    </div>
                    ${optionsHTML}
                    ${explanationHTML}
                `;

                container.appendChild(qCard);
            });

            renderMath();
        }

        function resetToStart() {
            clearInterval(timerInterval);
            document.getElementById('resultScreen').classList.add('hidden');
            document.getElementById('examScreen').classList.add('hidden');
            document.getElementById('startScreen').classList.remove('hidden');
            document.getElementById('timerContainer').classList.add('hidden');
        }

        function changeFontSize(delta) {
            fontSizeLevel = Math.max(0, Math.min(3, fontSizeLevel + delta));
            applyFontSize();
        }

        function resetFontSize() {
            fontSizeLevel = 1;
            applyFontSize();
        }

        function applyFontSize() {
            const body = document.body;
            fontSizeClasses.forEach(cls => body.classList.remove(cls));
            body.classList.add(fontSizeClasses[fontSizeLevel]);
        }

        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
            const icon = document.getElementById('darkModeIcon');
            if (document.documentElement.classList.contains('dark')) {
                icon.className = "fa-solid fa-sun text-amber-400";
            } else {
                icon.className = "fa-solid fa-moon";
            }
        }

        function renderMath() {
            if (window.renderMathInElement) {
                renderMathInElement(document.body, {
                    delimiters: [
                        {left: '$$', right: '$$', display: true},
                        {left: '$', right: '$', display: false}
                    ],
                    throwOnError : false
                });
            }
        }

        function showModal(title, message, buttons) {
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalMessage').textContent = message;
            
            const btnContainer = document.getElementById('modalButtons');
            btnContainer.innerHTML = '';

            buttons.forEach(b => {
                const btn = document.createElement('button');
                btn.className = `${b.bg} hover:opacity-90 text-white font-bold px-4 py-2 rounded-lg text-sm transition`;
                btn.textContent = b.text;
                btn.onclick = b.action;
                btnContainer.appendChild(btn);
            });

            document.getElementById('modalBackdrop').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modalBackdrop').classList.add('hidden');
        }
    </script>
</body>
</html>
